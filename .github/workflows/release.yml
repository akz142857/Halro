name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.3.0"
        required: true
        type: string
      dry_run:
        description: "Run every gate and build every artifact, but publish nothing"
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.26.6

jobs:
  # prepare is the one place a release version is decided. Everything downstream
  # reads needs.prepare.outputs.version rather than github.ref_name, which names
  # the main branch on the only supported workflow_dispatch entry.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      evidence_suffix: ${{ steps.resolve.outputs.evidence_suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve and validate the version being released
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION}"
          publish=true
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            publish=false
          fi
          # workflow_dispatch on the default branch is the only release entry.
          # The workflow creates the tag after every gate passes, then fans out
          # to the package repositories after the immutable release is public.
          if [ "${EVENT}" != "workflow_dispatch" ] || [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::release through workflow_dispatch on ${DEFAULT_BRANCH} only; event=${EVENT}, ref=${GITHUB_REF}"
            exit 1
          fi
          ci_runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&event=push&per_page=100")
          if ! jq -e --arg sha "${GITHUB_SHA}" --arg branch "${DEFAULT_BRANCH}" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch and .conclusion == "success")] | length > 0' \
            <<<"${ci_runs}" >/dev/null; then
            echo "::error::ordinary ci.yml has no successful main push run for exact commit ${GITHUB_SHA}"
            exit 1
          fi
          if ! printf '%s' "${version}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1, got '${version}'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null 2>&1; then
            tag_commit=$(git rev-list -n 1 "refs/tags/${version}")
            if [ "${publish}" != "true" ] || [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
              echo "::error::tag ${version} already exists at ${tag_commit}, not a resumable release of ${GITHUB_SHA}"
              exit 1
            fi
            if gh release view "${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::error::release ${version} is already published"
              exit 1
            fi
            echo "::notice::resuming unpublished tag ${version} at ${tag_commit}"
          fi
          # The changelog is what an operator reads to decide whether to upgrade.
          # Tagging without it is the mistake this catches, and it is cheap here.
          if ! grep -Fq "## [${version#v}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version#v}]' section for ${version}"
            exit 1
          fi
          # Decided here rather than with an Actions '&& x || y', which picks the
          # right-hand side whenever the left one is falsy — and '' is falsy, so
          # that shape labelled every run a rehearsal, real releases included.
          evidence_suffix=""
          if [ "${publish}" != "true" ]; then
            evidence_suffix="-dry-run"
          fi
          {
            printf 'version=%s\n' "${version}"
            printf 'publish=%s\n' "${publish}"
            printf 'evidence_suffix=%s\n' "${evidence_suffix}"
          } >>"${GITHUB_OUTPUT}"
          {
            printf '### Halro %s\n\n' "${version}"
            printf '| | |\n|---|---|\n'
            printf '| publish | `%s` |\n' "${publish}"
            printf '| ref | `%s` |\n' "${GITHUB_REF}"
            printf '| commit | `%s` |\n' "${GITHUB_SHA}"
          } >>"${GITHUB_STEP_SUMMARY}"

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify public repository and license boundary
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f THIRD_PARTY_NOTICES.md
          test ! -e v1.0.0.md
          ! git ls-files | grep -E '(^|/)(data|node_modules|bin)/|(^|/)(master\.key|config\.yaml|v1\.0\.0\.md)$|\.(hmbk|pem|p12|pprof|prof|test)$'
          sh scripts/check-dependency-license-review.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  sdk-compatibility:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/compatibility/python/requirements.txt
      - run: python -m pip install --require-hashes -r tests/compatibility/python/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: tests/compatibility/node
      - name: Audit compatibility SDK dependencies
        run: |
          python -m pip_audit --requirement tests/compatibility/python/requirements.txt --no-deps
          npm audit --audit-level=moderate --prefix tests/compatibility/node
          go -C tests/compatibility/go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Run official SDK black-box contracts
        shell: bash
        run: |
          set -euo pipefail
          compat_server=$(mktemp "${RUNNER_TEMP}/halro-compat-server.XXXXXX")
          go build -o "$compat_server" ./tests/compatibility/server
          "$compat_server" --listen 127.0.0.1:18088 &
          compat_server_pid=$!
          trap 'kill "$compat_server_pid" 2>/dev/null || true; rm -f "$compat_server"' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18088/healthz >/dev/null; then
              break
            fi
            if ! kill -0 "$compat_server_pid" 2>/dev/null; then
              wait "$compat_server_pid"
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18088/healthz >/dev/null
          python tests/compatibility/python/test_sdk.py
          npm test --prefix tests/compatibility/node
          go -C tests/compatibility/go test ./...

  stress:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: 1000 concurrent SSE cleanup gate
        run: HALRO_STRESS=1 go test ./tests/stress -run TestThousandConcurrentSSEConnectionsCleanup -count=1 -v

  web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --audit-level=moderate
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- internal/webui/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-dist
          path: internal/webui/dist

  binaries:
    needs: [prepare, quality, sdk-compatibility, web, stress]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: admin-dist
          path: internal/webui/dist
      - name: Build licensed static binary archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${RELEASE_COMMIT}")
          RELEASE_DATE=$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)
          export SOURCE_DATE_EPOCH RELEASE_DATE
          package_dir="release/halro-${GOOS}-${GOARCH}"
          mkdir -p "${package_dir}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/akz142857/Halro/internal/buildinfo.Version=${RELEASE_VERSION} -X github.com/akz142857/Halro/internal/buildinfo.Commit=${RELEASE_COMMIT} -X github.com/akz142857/Halro/internal/buildinfo.Date=${RELEASE_DATE}" \
            -o "${package_dir}/halro" ./cmd/halro
          go build -trimpath \
            -ldflags "-s -w" \
            -o "${package_dir}/halro-deadman" ./cmd/halro-deadman
          cp deploy/observability/external-probe/config.example.yaml \
            deploy/observability/external-probe/config.schema.json \
            deploy/observability/external-probe/event.schema.json \
            deploy/observability/external-probe/RECEIVER-CONTRACT.md \
            deploy/observability/external-probe/halro-deadman.service \
            "${package_dir}/"
          cp configs/config.example.yaml "${package_dir}/halro.config.example.yaml"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md "${package_dir}/"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@${SOURCE_DATE_EPOCH}" -C release -cf - \
            "halro-${GOOS}-${GOARCH}" | gzip -n >"release/halro-${GOOS}-${GOARCH}.tar.gz"
          rm -r "${package_dir}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: halro-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/halro-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  container:
    needs: [prepare, quality, sdk-compatibility, stress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build release container images per architecture
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${RELEASE_COMMIT}")
          RELEASE_DATE=$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)
          export SOURCE_DATE_EPOCH RELEASE_DATE
          # prepare validated the version against a strict semver pattern, so it
          # carries nothing an image tag has to be protected from. The image tag
          # and the release tag being the same string is what lets container-push
          # find these archives by name.
          IMAGE_TAG=${RELEASE_VERSION}
          for arch in amd64 arm64; do
            docker buildx build \
              --platform linux/${arch} \
              --load \
              --build-arg RELEASE_VERSION=${RELEASE_VERSION} \
              --build-arg RELEASE_COMMIT=${RELEASE_COMMIT} \
              --build-arg RELEASE_DATE=${RELEASE_DATE} \
              --build-arg SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} \
              --tag halro:${IMAGE_TAG}-${arch} .
            docker run --rm --platform linux/${arch} --entrypoint /usr/local/bin/halro halro:${IMAGE_TAG}-${arch} version
            test "$(docker image inspect halro:${IMAGE_TAG}-${arch} --format '{{.Config.User}}')" = "65532:65532"
            test "$(docker image inspect halro:${IMAGE_TAG}-${arch} --format '{{.Architecture}}')" = "${arch}"
            docker save halro:${IMAGE_TAG}-${arch} | gzip -n > halro-container-${arch}.tar.gz
            docker buildx build \
              --platform linux/${arch} \
              --load \
              -f deploy/observability/external-probe/Dockerfile \
              --build-arg SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH} \
              --tag halro-deadman:${IMAGE_TAG}-${arch} .
            test "$(docker image inspect halro-deadman:${IMAGE_TAG}-${arch} --format '{{.Config.User}}')" = "65532:65532"
            test "$(docker image inspect halro-deadman:${IMAGE_TAG}-${arch} --format '{{.Architecture}}')" = "${arch}"
            docker save halro-deadman:${IMAGE_TAG}-${arch} | gzip -n > halro-deadman-container-${arch}.tar.gz
          done
          docker tag halro:${IMAGE_TAG}-amd64 halro:release
          docker tag halro-deadman:${IMAGE_TAG}-amd64 halro-deadman:release
      - name: Generate release container SPDX SBOMs
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for name in halro halro-deadman; do
            for arch in amd64 arm64; do
              docker run --rm \
                -v "$PWD:/output" \
                -v /var/run/docker.sock:/var/run/docker.sock \
                anchore/syft@sha256:bd5357d2cd087f03af748dac24df48bfbc1723080d78f75f69aca1f2d429060e \
                "docker:${name}:${IMAGE_TAG}-${arch}" \
                -o "spdx-json=/output/${name}-container-${arch}.spdx.json"
            done
          done
      - name: Scan release gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: halro:release
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
      - name: Scan release dead-man image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: halro-deadman:release
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: halro-container
          path: |
            halro-container-amd64.tar.gz
            halro-container-arm64.tar.gz
            halro-deadman-container-amd64.tar.gz
            halro-deadman-container-arm64.tar.gz
            halro-container-amd64.spdx.json
            halro-container-arm64.spdx.json
            halro-deadman-container-amd64.spdx.json
            halro-deadman-container-arm64.spdx.json

  debian-packages:
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: halro-linux-*
          path: release-input
          merge-multiple: true
      - name: Build Debian packages from the released Linux binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "${GITHUB_SHA}")
          export SOURCE_DATE_EPOCH
          for arch in amd64 arm64; do
            tools/release/build_deb.sh \
              --version "${VERSION}" \
              --arch "${arch}" \
              --archive "release-input/halro-linux-${arch}.tar.gz" \
              --output release
          done
          halro_deb=$(find release -maxdepth 1 -name 'halro_*_amd64.deb' -print)
          deadman_deb=$(find release -maxdepth 1 -name 'halro-deadman_*_amd64.deb' -print)
          test "$(printf '%s\n' "${halro_deb}" | grep -c .)" -eq 1
          test "$(printf '%s\n' "${deadman_deb}" | grep -c .)" -eq 1
          tools/release/test_deb.sh "${halro_deb}" "${deadman_deb}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: halro-debian
          path: release/*.deb

  provenance:
    needs: [prepare, binaries, container, debian-packages]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: halro-*
          path: release
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: release/halro.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Prepare released binaries for artifact SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/sbom-binary-input
          for archive in release/halro-linux-*.tar.gz release/halro-darwin-*.tar.gz; do
            tar -xzf "${archive}" -C release/sbom-binary-input
          done
      - name: Generate released-binary SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: release/sbom-binary-input
          format: spdx-json
          output-file: release/halro-binaries.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Remove extracted SBOM inputs
        run: rm -r release/sbom-binary-input
      - name: Attest release build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/halro-*.tar.gz
            release/*.deb
            release/halro*.spdx.json
      - name: Generate checksums
        working-directory: release
        run: sha256sum halro-* halro.spdx.json > checksums.txt
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless sign release blobs
        working-directory: release
        run: |
          for artifact in halro-* halro.spdx.json checksums.txt; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done
      # The manifest pins the version tag this run releases, which on a dispatch
      # run is not the ref the run was started from — that one names the branch.
      # A dry run signs a manifest for a tag it will not create, so its artifact
      # is named apart from a real release's; the run id inside the manifest is
      # what ties either to the run that produced it.
      - name: Generate and sign release-run evidence manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 tools/release/run_evidence.py create \
            --release-dir release \
            --output evidence/release-run-evidence.json \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --commit "${GITHUB_SHA}" \
            --ref "refs/tags/${VERSION}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}"
          cosign sign-blob --yes \
            --bundle evidence/release-run-evidence.json.sigstore.json \
            evidence/release-run-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-run-evidence-${{ github.run_id }}-${{ github.run_attempt }}${{ needs.prepare.outputs.evidence_suffix }}
          path: evidence
          retention-days: 90

  publish:
    needs: [prepare, provenance]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify release blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check checksums.txt)
          for artifact in release/halro-*.tar.gz release/*.deb release/halro*.spdx.json; do
            gh attestation verify "${artifact}" --repo "${GITHUB_REPOSITORY}" \
              --source-digest "${GITHUB_SHA}" \
              --source-ref refs/heads/main \
              --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
          done
          for artifact in release/halro-* release/halro.spdx.json release/checksums.txt; do
            case "${artifact}" in
              *.sigstore.json) continue ;;
            esac
            cosign verify-blob \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --bundle "${artifact}.sigstore.json" \
              "${artifact}"
          done
      # A dispatch run tags here rather than at the start, so every gate has
      # passed and every artifact has been built, signed and verified before the
      # version exists in the repository. A release that fails leaves no tag to
      # retract, and no tag that a reader could mistake for a published one.
      - name: Create the release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null 2>&1; then
            tag_commit=$(git rev-list -n 1 "refs/tags/${VERSION}")
            if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
              echo "::error::tag ${VERSION} points to ${tag_commit}, expected ${GITHUB_SHA}"
              exit 1
            fi
            echo "tag ${VERSION} already points to ${GITHUB_SHA}; resuming publish"
          else
            git tag -a "${VERSION}" -m "Halro ${VERSION}" "${GITHUB_SHA}"
            git push origin "refs/tags/${VERSION}"
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "release ${VERSION} already exists; skipping creation"
          else
            gh release create "${VERSION}" release/* --verify-tag --generate-notes --title "Halro ${VERSION}"
          fi

  container-push:
    needs: [prepare, publish]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        run: printf '%s' "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push release container images from the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          tag="${VERSION}"
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
            -p 'halro-container-*.tar.gz' -p 'halro-deadman-container-*.tar.gz' -p checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          for name in halro halro-deadman; do
            refs=""
            for arch in amd64 arm64; do
              docker load < "${name}-container-${arch}.tar.gz"
              docker tag "${name}:${tag}-${arch}" "ghcr.io/${owner}/${name}:${tag}-${arch}"
              docker push "ghcr.io/${owner}/${name}:${tag}-${arch}"
              refs="${refs} ghcr.io/${owner}/${name}:${tag}-${arch}"
            done
            docker buildx imagetools create -t "ghcr.io/${owner}/${name}:${tag}" ${refs}
            docker buildx imagetools create -t "ghcr.io/${owner}/${name}:latest" ${refs}
          done

  downstream-package-repositories:
    needs: [prepare, publish, container-push]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create a repository-scoped release automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HALRO_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HALRO_RELEASE_APP_PRIVATE_KEY }}
          owner: halro-ai
          repositories: |
            homebrew-tap
            apt-repository
          permission-contents: write
      - name: Dispatch the exact published release to Homebrew and APT
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${RELEASE_COMMIT}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::release commit is not a full SHA: ${RELEASE_COMMIT}"
            exit 1
          fi
          payload=$(jq -n \
            --arg version "${VERSION}" \
            --arg commit "${RELEASE_COMMIT}" \
            --arg release_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}" \
            --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{event_type:"halro-release-published",client_payload:{version:$version,commit:$commit,release_url:$release_url,run_url:$run_url}}')
          for repository in homebrew-tap apt-repository; do
            printf '%s' "${payload}" | gh api \
              --method POST "repos/halro-ai/${repository}/dispatches" \
              --input -
          done
