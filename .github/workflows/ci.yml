name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify public repository boundaries
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f THIRD_PARTY_NOTICES.md
          test ! -e v1.0.0.md
          ! git ls-files | grep -E '(^|/)(data|node_modules|bin)/|(^|/)(master\.key|config\.yaml|v1\.0\.0\.md)$|\.(hmbk|pem|p12|pprof|prof|test)$'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --audit-level=moderate
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- internal/webui/dist

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go build -trimpath ./cmd/heimdall

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build non-root distroless image
        run: |
          docker build \
            --build-arg RELEASE_VERSION=ci \
            --build-arg RELEASE_COMMIT=${GITHUB_SHA} \
            --build-arg RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --tag heimdall:ci .
      - name: Verify image command and metadata
        run: |
          docker run --rm --entrypoint /usr/local/bin/heimdall heimdall:ci version
          test "$(docker image inspect heimdall:ci --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect heimdall:ci --format '{{json .Config.Healthcheck.Test}}')" = '["CMD","/usr/local/bin/heimdall","healthcheck"]'

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Prometheus, Alertmanager and Grafana provisioning
        run: ./deploy/observability/validate.sh
      - name: Validate Compose topology
        run: |
          docker compose -f deploy/observability/compose.example.yaml config --quiet
          docker compose -f deploy/observability/external-probe.example.yaml config --quiet

  observability-sbom:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: prometheus
            image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          - name: alertmanager
            image: prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
          - name: grafana
            image: grafana/grafana@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
          - name: independent-probe
            image: curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    steps:
      - uses: actions/checkout@v7
      - name: Generate SPDX SBOM with digest-pinned Syft
        run: >-
          docker run --rm
          -v "$PWD:/output"
          anchore/syft@sha256:bd5357d2cd087f03af748dac24df48bfbc1723080d78f75f69aca1f2d429060e
          "registry:${{ matrix.image }}"
          -o "spdx-json=/output/${{ matrix.name }}.spdx.json"
      - uses: actions/upload-artifact@v6
        with:
          name: observability-sbom-${{ matrix.name }}
          path: ${{ matrix.name }}.spdx.json

  sdk-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/compatibility/python/requirements.txt
      - run: python -m pip install -r tests/compatibility/python/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: tests/compatibility/node
      - name: Run official SDK black-box contracts
        shell: bash
        run: |
          set -euo pipefail
          go run ./tests/compatibility/server --listen 127.0.0.1:18088 &
          compat_server_pid=$!
          trap 'kill "$compat_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18088/healthz >/dev/null; then
              break
            fi
            if ! kill -0 "$compat_server_pid" 2>/dev/null; then
              wait "$compat_server_pid"
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18088/healthz >/dev/null
          python tests/compatibility/python/test_sdk.py
          npm test --prefix tests/compatibility/node
          go -C tests/compatibility/go test ./...
