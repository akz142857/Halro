name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify public repository boundaries
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f THIRD_PARTY_NOTICES.md
          test ! -e v1.0.0.md
          ! git ls-files | grep -E '(^|/)(data|node_modules|bin)/|(^|/)(master\.key|config\.yaml|v1\.0\.0\.md)$|\.(hmbk|pem|p12|pprof|prof|test)$'
      - name: Verify dependency license review is current
        run: sh scripts/check-dependency-license-review.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --audit-level=moderate
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- internal/webui/dist

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Verify KMS dependency and spike boundaries
        run: |
          sh -n tools/m11/aws-sdk-spike/run.sh
          sh -n tools/m11/aws-kms-smoke/run.sh
          sh -n tools/m11/aws-kms-dual-slot-smoke/run.sh
          sh -n tools/m11/aws-kms-lifecycle-smoke/run.sh
          sh -n tools/m11/aws-kms-dr-smoke/run.sh
          python3 -m unittest tools/m11/aws-kms-smoke/test_verify_cloudtrail.py
          python3 -m unittest \
            tools/modelcatalog/test_verify_publication_gate.py \
            tools/modelcatalog/test_workflow_contract.py \
            tools/release/test_verify_environment.py \
            tools/release/test_run_evidence.py
          ./tools/m11/check-kms-boundaries.sh
          ./tools/m11/check-production-assets.sh
      - name: Go vulnerability scan
        run: GOTOOLCHAIN=go1.26.6 go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go build -trimpath ./cmd/halro ./cmd/halro-deadman

  # Seeded corpora and regression inputs live in testdata and run with every
  # `go test`; this job is the part that looks for inputs nobody has thought of
  # yet. It is deliberately short — a few minutes per push, not an overnight
  # campaign — because its job here is to catch a regression in a parser that
  # sits in front of authenticated traffic, not to exhaust the input space.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz the parsers on the request path
        run: |
          set -eu
          # package:target, one -fuzz run each; go test accepts a single target.
          for entry in \
            ./internal/sse:FuzzEncodeDecodeRoundTrip \
            ./internal/sse:FuzzDecoderNeverPanics \
            ./internal/openaiapi:FuzzDecodeRequestsNeverPanic \
            ./internal/openaiapi:FuzzDecodeInferenceResourcesRequestsNeverPanic \
            ./internal/redaction:FuzzRuleCompilerNeverPanics \
            ./internal/safelog:FuzzRedactNeverLeaksSeededSecret \
            ./internal/redaction:FuzzBoundedStreamMatchesNonStream \
            ./internal/tokenguard:FuzzRestoreCheckpointNeverPanics
          do
            package="${entry%%:*}"
            target="${entry##*:}"
            echo "::group::${package} ${target}"
            # `go test -fuzz` prints "no fuzz tests to fuzz" and exits 0 when the
            # pattern matches nothing, so a renamed target silently stops being
            # fuzzed while the job stays green. That is what happened to the
            # Phase 2 decoder: it was renamed and nothing ran it for a week.
            if ! grep -rq "func ${target}(" "${package#./}"; then
              echo "::error::${target} does not exist in ${package}; the fuzz list is stale"
              exit 1
            fi
            go test "${package}" -run '^$' -fuzz "^${target}$" -fuzztime 40s
            echo "::endgroup::"
          done
      # A crash that only exists as an expiring artifact is found once and then
      # forgotten. Printing the input inline means the reproducer survives in
      # the job log, and committing the file it names turns the crash into a
      # regression test — which is the whole point of a seed corpus.
      - name: Show any failing input so it can be committed as a seed
        if: failure()
        run: |
          set -eu
          found=0
          while IFS= read -r file; do
            found=1
            echo "::group::${file}"
            cat "${file}"
            echo "::endgroup::"
          done < <(find internal -path '*/testdata/fuzz/*' -type f -newer go.mod)
          if [ "${found}" -eq 1 ]; then
            echo "::notice::Commit the files above under testdata/fuzz to pin these as regression seeds."
          fi
      - name: Preserve any failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-failures
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build non-root distroless image
        run: |
          docker build \
            --build-arg RELEASE_VERSION=ci \
            --build-arg RELEASE_COMMIT=${GITHUB_SHA} \
            --build-arg RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --tag halro:ci .
      - name: Verify image command and metadata
        run: |
          docker run --rm --entrypoint /usr/local/bin/halro halro:ci version
          test "$(docker image inspect halro:ci --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect halro:ci --format '{{json .Config.Healthcheck.Test}}')" = '["CMD","/usr/local/bin/halro","healthcheck"]'
      - name: Initialize a mounted volume and reach readiness
        shell: bash
        run: |
          set -euo pipefail
          fixture="${RUNNER_TEMP}/halro-container-runtime"
          secrets="${fixture}/secrets"
          config_file="${fixture}/config.yaml"
          volume="halro-ci-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="halro-ci-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p "$secrets"
          chmod 0777 "$secrets"
          sed \
            -e 's|gateway_listen: 127.0.0.1:8080|gateway_listen: 0.0.0.0:8080|' \
            -e 's|data_dir: ./data|data_dir: /var/lib/halro/data|' \
            -e 's|file: ./master.key|file: /run/secrets/halro-master.key|' \
            internal/config/default.yaml >"$config_file"
          docker volume create "$volume" >/dev/null
          docker run --rm \
            --volume "$config_file:/etc/halro/config.yaml:ro" \
            --volume "$secrets:/run/secrets" \
            --volume "$volume:/var/lib/halro" \
            halro:ci init --config /etc/halro/config.yaml
          test -s "$secrets/halro-master.key"
          docker run --detach --name "$container" \
            --publish 127.0.0.1:18080:8080 \
            --volume "$config_file:/etc/halro/config.yaml:ro" \
            --volume "$secrets:/run/secrets:ro" \
            --volume "$volume:/var/lib/halro" \
            halro:ci serve --config /etc/halro/config.yaml --allow-insecure-public-listen
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then
              break
            fi
            if ! docker inspect "$container" --format '{{.State.Running}}' | grep -qx true; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null
          for attempt in {1..60}; do
            health="$(docker inspect "$container" --format '{{.State.Health.Status}}')"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$health" = unhealthy ]; then
              docker inspect "$container" --format '{{json .State.Health}}'
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect "$container" --format '{{.State.Health.Status}}')" = healthy

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Prometheus and Alertmanager provisioning
        run: ./deploy/observability/validate.sh
      - name: Validate Core Compose topology
        run: |
          docker compose -f deploy/observability/compose.example.yaml config --quiet
          test "$(docker compose -f deploy/observability/compose.example.yaml config --services | sort | tr '\n' ' ')" = "alertmanager prometheus "
      - name: Validate macOS local Core override
        run: |
          docker compose \
            -f deploy/observability/compose.example.yaml \
            -f deploy/observability/compose.macos.example.yaml \
            config --quiet
          test "$(docker compose -f deploy/observability/compose.example.yaml -f deploy/observability/compose.macos.example.yaml config --services | sort | tr '\n' ' ')" = "alertmanager prometheus "
      - name: Validate independent probe topology
        run: |
          docker compose -f deploy/observability/external-probe.example.yaml config --quiet
      - name: Run Core runtime smoke
        run: ./deploy/observability/smoke.sh
      - name: Build and verify independent dead-man image
        run: |
          docker build \
            -f deploy/observability/external-probe/Dockerfile \
            -t halro-deadman:ci .
          test "$(docker image inspect halro-deadman:ci --format '{{.Config.User}}')" = "65532:65532"
      - name: Scan independent dead-man image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: halro-deadman:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln,secret,misconfig

  observability-sbom:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: prometheus
            image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          - name: alertmanager
            image: prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate SPDX SBOM with digest-pinned Syft
        run: >-
          docker run --rm
          -v "$PWD:/output"
          anchore/syft@sha256:bd5357d2cd087f03af748dac24df48bfbc1723080d78f75f69aca1f2d429060e
          "registry:${{ matrix.image }}"
          -o "spdx-json=/output/${{ matrix.name }}.spdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observability-sbom-${{ matrix.name }}
          path: ${{ matrix.name }}.spdx.json

  deadman-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build independent dead-man image
        run: >-
          docker build
          -f deploy/observability/external-probe/Dockerfile
          -t halro-deadman:ci .
      - name: Generate independent dead-man SPDX SBOM
        run: >-
          docker run --rm
          -v "$PWD:/output"
          -v /var/run/docker.sock:/var/run/docker.sock
          anchore/syft@sha256:bd5357d2cd087f03af748dac24df48bfbc1723080d78f75f69aca1f2d429060e
          docker:halro-deadman:ci
          -o spdx-json=/output/independent-deadman.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observability-sbom-independent-deadman
          path: independent-deadman.spdx.json

  sdk-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/compatibility/python/requirements.txt
      - run: python -m pip install -r tests/compatibility/python/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: tests/compatibility/node
      - name: Run official SDK black-box contracts
        shell: bash
        run: |
          set -euo pipefail
          compat_server=$(mktemp "${RUNNER_TEMP}/halro-compat-server.XXXXXX")
          go build -o "$compat_server" ./tests/compatibility/server
          "$compat_server" --listen 127.0.0.1:18088 &
          compat_server_pid=$!
          trap 'kill "$compat_server_pid" 2>/dev/null || true; rm -f "$compat_server"' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:18088/healthz >/dev/null; then
              break
            fi
            if ! kill -0 "$compat_server_pid" 2>/dev/null; then
              wait "$compat_server_pid"
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:18088/healthz >/dev/null
          python tests/compatibility/python/test_sdk.py
          npm test --prefix tests/compatibility/node
          go -C tests/compatibility/go test ./...
