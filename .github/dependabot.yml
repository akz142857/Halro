version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: "/tests/compatibility/go"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      admin-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/tests/compatibility/node"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/tests/compatibility/python"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
