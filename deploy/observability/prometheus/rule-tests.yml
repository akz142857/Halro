  # backlog/read failures respect their `for` windows, and a counter increment
  # pages only while it remains inside the lookback window.
  - interval: 1m
    input_series:
      - series: 'halro_admin_audit_intents_pending{environment="test",region="local",cluster="standalone",instance="one"}'
        values: '1x16 0x3'
    alert_rule_test:
      - eval_time: 14m
        alertname: HalroAdminAuditBacklogStuck
        exp_alerts: []
      - eval_time: 15m
        alertname: HalroAdminAuditBacklogStuck
        exp_alerts:
          - exp_labels: {alertname: HalroAdminAuditBacklogStuck, category: audit, cluster: standalone, environment: test, instance: one, owner: security, region: local, service: halro, severity: critical}
            exp_annotations: {summary: Halro administrative mutations are committed with their audit records unwritten, runbook_url: /docs/observability/operations-runbook.md#halroadminauditbacklogstuck}
      - eval_time: 17m
        alertname: HalroAdminAuditBacklogStuck
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'halro_admin_audit_intents_pending{environment="test",region="local",cluster="standalone",instance="one"}'
        values: '-1x6 0x2'
    alert_rule_test:
      - eval_time: 4m
        alertname: HalroAdminAuditBacklogUnreadable
        exp_alerts: []
      - eval_time: 5m
        alertname: HalroAdminAuditBacklogUnreadable
        exp_alerts:
          - exp_labels: {alertname: HalroAdminAuditBacklogUnreadable, category: audit, cluster: standalone, environment: test, instance: one, owner: security, region: local, service: halro, severity: critical}
            exp_annotations: {summary: Halro cannot read its administrative audit backlog, runbook_url: /docs/observability/operations-runbook.md#halroadminauditbacklogunreadable}
      - eval_time: 7m
        alertname: HalroAdminAuditBacklogUnreadable
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'halro_admin_audit_delivery_failures_total{environment="test",region="local",cluster="standalone",instance="one"}'
        values: '0 1x18'
    alert_rule_test:
      - eval_time: 1m
        alertname: HalroAdminAuditDeliveryFailing
        exp_alerts:
          - exp_labels: {alertname: HalroAdminAuditDeliveryFailing, category: audit, cluster: standalone, environment: test, instance: one, owner: security, region: local, service: halro, severity: warning}
            exp_annotations: {summary: Halro failed to append an administrative mutation's audit record, runbook_url: /docs/observability/operations-runbook.md#halroadminauditdeliveryfailing}
      - eval_time: 17m
        alertname: HalroAdminAuditDeliveryFailing
        exp_alerts: []

  # Upstream refusal alerts distinguish an operator-actionable dead credential
  # from quota and from a temporary rate limit, then resolve with the gauge.
  - interval: 1m
    input_series:
      - series: 'halro_route_suspended{environment="test",region="local",cluster="standalone",instance="one",scope_kind="credential",reason="invalid_credential"}'
        values: '1x6 0'
      - series: 'halro_route_suspended{environment="test",region="local",cluster="standalone",instance="one",scope_kind="credential_model",reason="subscription_quota_exhausted"}'
        values: '1x6 0'
      - series: 'halro_route_suspended{environment="test",region="local",cluster="standalone",instance="one",scope_kind="provider",reason="rate_limited"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 1m
        alertname: HalroCredentialUnusable
        exp_alerts:
          - exp_labels: {alertname: HalroCredentialUnusable, category: provider, cluster: standalone, environment: test, instance: one, owner: sre, reason: invalid_credential, region: local, scope_kind: credential, service: halro, severity: critical}
            exp_annotations: {summary: A Halro Provider credential is refused upstream and will not recover on its own, runbook_url: /docs/observability/operations-runbook.md#halrocredentialunusable}
      - eval_time: 5m
        alertname: HalroProviderQuotaExhausted
        exp_alerts:
          - exp_labels: {alertname: HalroProviderQuotaExhausted, category: provider, cluster: standalone, environment: test, instance: one, owner: sre, reason: subscription_quota_exhausted, region: local, scope_kind: credential_model, service: halro, severity: warning}
            exp_annotations: {summary: A Halro upstream has exhausted its quota, runbook_url: /docs/observability/operations-runbook.md#halroproviderquotaexhausted}
      - eval_time: 7m
        alertname: HalroCredentialUnusable
        exp_alerts: []
      - eval_time: 7m
        alertname: HalroProviderQuotaExhausted
        exp_alerts: []

  # A single rejection keeps the one-hour expression true long enough for the
  # five-minute guard, then ages out. The two reason labels are separate
  # operator actions and must never collapse into one alert.
  - interval: 1m
    input_series:
      - series: 'halro_policy_rejections_total{environment="test",region="local",cluster="standalone",instance="one",reason="budget"}'
        values: '0 1x70'
      - series: 'halro_policy_rejections_total{environment="test",region="local",cluster="standalone",instance="one",reason="run_budget"}'
        values: '0 1x70'
    alert_rule_test:
      - eval_time: 6m
        alertname: HalroProjectDailyBudgetRefusingTraffic
        exp_alerts:
          - exp_labels: {alertname: HalroProjectDailyBudgetRefusingTraffic, category: cost, cluster: standalone, environment: test, instance: one, owner: product, reason: budget, region: local, service: halro, severity: warning}
            exp_annotations: {summary: A Halro Project reached its daily budget and requests are being refused, runbook_url: /docs/observability/operations-runbook.md#halroprojectdailybudgetrefusingtraffic}
      - eval_time: 6m
        alertname: HalroRunBudgetRefusingTraffic
        exp_alerts:
          - exp_labels: {alertname: HalroRunBudgetRefusingTraffic, category: cost, cluster: standalone, environment: test, instance: one, owner: product, reason: run_budget, region: local, service: halro, severity: warning}
            exp_annotations: {summary: A Halro Run reached its budget and requests are being refused, runbook_url: /docs/observability/operations-runbook.md#halrorunbudgetrefusingtraffic}
      - eval_time: 66m
        alertname: HalroProjectDailyBudgetRefusingTraffic
        exp_alerts: []
      - eval_time: 66m
        alertname: HalroRunBudgetRefusingTraffic
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'halro_cost_usd_total{environment="test",region="local",cluster="standalone",instance="one",provider="openai"}'
        values: '_x11 0x2'
    alert_rule_test:
      - eval_time: 9m
        alertname: HalroProviderSpendUnreported
        exp_alerts: []
      - eval_time: 10m
        alertname: HalroProviderSpendUnreported
        exp_alerts:
          - exp_labels: {alertname: HalroProviderSpendUnreported, category: cost, owner: sre, service: halro, severity: critical}
            exp_annotations: {summary: Halro is not reporting Provider spend at all, runbook_url: /docs/observability/operations-runbook.md#halroproviderspendunreported}
      - eval_time: 11m
        alertname: HalroProviderSpendUnreported
        exp_alerts: []

  # Durable write path. A slow fsync and a saturated per-project accounting lock
  # both present as "requests got slower"; these two series are what tell them
  # apart, so they are worth pinning.
  - interval: 1m
    input_series:
      - series: 'halro_wal_sync_seconds_sum{environment="test",region="local",cluster="standalone",instance="one"}'
        values: '0+1x20'
      - series: 'halro_wal_sync_seconds_count{environment="test",region="local",cluster="standalone",instance="one"}'
        values: '0+10x20'
      - series: 'halro_accounting_project_lock_wait_seconds_sum{environment="test",region="local",cluster="standalone",instance="one"}'
        values: '0+3x20'
      - series: 'halro_accounting_project_lock_wait_seconds_count{environment="test",region="local",cluster="standalone",instance="one"}'
        values: '0+10x20'
    alert_rule_test:
      # 0.1s per fsync, sustained.
      - eval_time: 17m
        alertname: HalroWALSyncSlow
        exp_alerts:
          - exp_labels: {alertname: HalroWALSyncSlow, category: accounting, cluster: standalone, environment: test, instance: one, owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: Halro Ledger fsync is slow enough to cap accounting throughput, runbook_url: /docs/observability/operations-runbook.md#halrowalsyncslow}
      # 0.3s mean wait per acquisition, sustained.
      - eval_time: 21m
        alertname: HalroAccountingProjectLockSaturated
        exp_alerts:
          - exp_labels: {alertname: HalroAccountingProjectLockSaturated, category: accounting, cluster: standalone, environment: test, instance: one, owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: Halro requests are queueing on one project's accounting lock, runbook_url: /docs/observability/operations-runbook.md#halroaccountingprojectlocksaturated}
      # Neither has been true long enough yet at 6m.
      - eval_time: 6m
        alertname: HalroAccountingProjectLockSaturated
        exp_alerts: []

  # Optional client-final observer alerts must stay silent before deployment
  # and must not accept an identically labelled gauge from another scrape job.
  - interval: 1m
    input_series:
      - series: 'up{job="other",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: HalroClientObserverDown
        exp_alerts: []
      - eval_time: 3m
        alertname: HalroClientObserverCoverageIncomplete
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '1 0x3 1x2'
      - series: 'halro_ha_client_observer_ready{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '1x6'
      - series: 'halro_ha_client_observer_unreconciled_operations{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '0x6'
    alert_rule_test:
      - eval_time: 1m
        alertname: HalroClientObserverDown
        exp_alerts: []
      - eval_time: 2m
        alertname: HalroClientObserverDown
        exp_alerts:
          - exp_labels: {alertname: HalroClientObserverDown, category: ha, cluster: ha, environment: test, instance: client-a, job: halro-client-observer, expected_client_observer: "true", owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: An accepted client-final observer target is down, runbook_url: /docs/observability/operations-runbook.md#halroclientobserverdown}
      - eval_time: 5m
        alertname: HalroClientObserverDown
        exp_alerts: []
      - eval_time: 2m
        alertname: HalroClientObserverCoverageIncomplete
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '1x8'
      - series: 'halro_ha_client_observer_ready{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '1 0x2 1x4'
      - series: 'halro_ha_client_observer_unreconciled_operations{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '0x4 1x2 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: HalroClientObserverCoverageIncomplete
        exp_alerts:
          - exp_labels: {alertname: HalroClientObserverCoverageIncomplete, category: ha, cluster: ha, environment: test, instance: client-a, job: halro-client-observer, expected_client_observer: "true", owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: "A client-final observer is unready, unreconciled or missing its coverage gauges", runbook_url: /docs/observability/operations-runbook.md#halroclientobservercoverageincomplete}

      - eval_time: 4m
        alertname: HalroClientObserverCoverageIncomplete
        exp_alerts: []
      - eval_time: 6m
        alertname: HalroClientObserverCoverageIncomplete
        exp_alerts:
          - exp_labels: {alertname: HalroClientObserverCoverageIncomplete, category: ha, cluster: ha, environment: test, instance: client-a, job: halro-client-observer, expected_client_observer: "true", owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: "A client-final observer is unready, unreconciled or missing its coverage gauges", runbook_url: /docs/observability/operations-runbook.md#halroclientobservercoverageincomplete}
      - eval_time: 8m
        alertname: HalroClientObserverCoverageIncomplete
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '1x4'
      - series: 'halro_ha_client_observer_ready{job="other",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '1x4'
      - series: 'halro_ha_client_observer_unreconciled_operations{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '0x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: HalroClientObserverCoverageIncomplete
        exp_alerts:
          - exp_labels: {alertname: HalroClientObserverCoverageIncomplete, category: ha, cluster: ha, environment: test, instance: client-a, job: halro-client-observer, expected_client_observer: "true", owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: "A client-final observer is unready, unreconciled or missing its coverage gauges", runbook_url: /docs/observability/operations-runbook.md#halroclientobservercoverageincomplete}

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="v3"}'
        values: '1x5'
      - series: 'halro_replication_member_state_version{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="v3"}'
        values: '3x5'
      - series: 'halro_replication_transition_journal_capacity_readable{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="v3"}'
        values: '1 0x2 1x2'
      - series: 'halro_replication_transition_journal_capacity_readable{job="other",expected_target="true",environment="test",region="local",cluster="ha",instance="wrong-job"}'
        values: '0x5'
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="v2"}'
        values: '1x5'
      - series: 'halro_replication_member_state_version{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="v2"}'
        values: '2x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: HalroTransitionJournalCapacityUnreadable
        exp_alerts: []
      - eval_time: 2m
        alertname: HalroTransitionJournalCapacityUnreadable
        exp_alerts:
          - exp_labels: {alertname: HalroTransitionJournalCapacityUnreadable, category: ha, cluster: ha, environment: test, expected_target: "true", instance: v3, job: halro, owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: "A version-3 Halro member cannot account for its retained transition journal files", runbook_url: /docs/observability/operations-runbook.md#halrotransitionjournalcapacityunreadable}
      - eval_time: 4m
        alertname: HalroTransitionJournalCapacityUnreadable
        exp_alerts: []

  # A previous readable=1 cannot mask a missing current v3 capacity sample.
  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="v3"}'
        values: '1x5'
      - series: 'halro_replication_member_state_version{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="v3"}'
        values: '3x5'
      - series: 'halro_replication_transition_journal_capacity_readable{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="v3"}'
        values: '1x2 _x2 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: HalroTransitionJournalCapacityUnreadable
        exp_alerts: []
      - eval_time: 4m
        alertname: HalroTransitionJournalCapacityUnreadable
        exp_alerts:
          - exp_labels: {alertname: HalroTransitionJournalCapacityUnreadable, category: ha, cluster: ha, environment: test, expected_target: "true", instance: v3, job: halro, owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: "A version-3 Halro member cannot account for its retained transition journal files", runbook_url: /docs/observability/operations-runbook.md#halrotransitionjournalcapacityunreadable}
      - eval_time: 5m
        alertname: HalroTransitionJournalCapacityUnreadable
        exp_alerts: []

  # Prometheus lookback can still return a prior ready=1 after the exporter
  # omits a scrape. Timestamp alignment must see that single-source gap.
  - interval: 1m
    input_series:
      - series: 'up{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '1x7'
      - series: 'halro_ha_client_observer_ready{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '1x1 _x2 1x2'
      - series: 'halro_ha_client_observer_unreconciled_operations{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 1m
        alertname: HalroClientObserverCoverageIncomplete
        exp_alerts: []
      - eval_time: 3m
        alertname: HalroClientObserverCoverageIncomplete
        exp_alerts:
          - exp_labels: {alertname: HalroClientObserverCoverageIncomplete, category: ha, cluster: ha, environment: test, instance: client-a, job: halro-client-observer, expected_client_observer: "true", owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: "A client-final observer is unready, unreconciled or missing its coverage gauges", runbook_url: /docs/observability/operations-runbook.md#halroclientobservercoverageincomplete}
      - eval_time: 5m
        alertname: HalroClientObserverCoverageIncomplete
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '1x4'
      - series: 'halro_ha_client_observer_ready{job="halro-client-observer",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '1x4'
      - series: 'halro_ha_client_observer_unreconciled_operations{job="other",expected_client_observer="true",environment="test",region="local",cluster="ha",instance="client-a"}'
        values: '0x4'
    alert_rule_test:
      - eval_time: 2m
        alertname: HalroClientObserverCoverageIncomplete
        exp_alerts:
          - exp_labels: {alertname: HalroClientObserverCoverageIncomplete, category: ha, cluster: ha, environment: test, instance: client-a, job: halro-client-observer, expected_client_observer: "true", owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: "A client-final observer is unready, unreconciled or missing its coverage gauges", runbook_url: /docs/observability/operations-runbook.md#halroclientobservercoverageincomplete}

  # A fresh epoch record cannot be minted from omitted term/incarnation samples
  # and must wait until their five-minute coverage gap ages out after recovery.
  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x14'
      - series: 'halro_cluster_term{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '7x5 _ _ 7x6'
      - series: 'halro_cluster_incarnation_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",incarnation="inc_1"}'
        values: '1x14'
    promql_expr_test:
      - expr: 'halro:ha_epoch_stable:bool{instance="one"}'
        eval_time: 5m
        exp_samples:
          - labels: 'halro:ha_epoch_stable:bool{environment="test",region="local",cluster="ha",instance="one"}'
            value: 1
      - expr: 'halro:ha_epoch_stable:bool{instance="one"}'
        eval_time: 6m
        exp_samples: []
      - expr: 'halro:ha_epoch_stable:bool{instance="one"}'
        eval_time: 8m
        exp_samples: []
      - expr: 'halro:ha_epoch_stable:bool{instance="one"}'
        eval_time: 12m
        exp_samples:
          - labels: 'halro:ha_epoch_stable:bool{environment="test",region="local",cluster="ha",instance="one"}'
            value: 1

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x14'
      - series: 'halro_cluster_term{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '7x14'
      - series: 'halro_cluster_incarnation_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",incarnation="inc_1"}'
        values: '1x5 _ _ 1x6'
    promql_expr_test:
      - expr: 'halro:ha_epoch_stable:bool{instance="one"}'
        eval_time: 5m
        exp_samples:
          - labels: 'halro:ha_epoch_stable:bool{environment="test",region="local",cluster="ha",instance="one"}'
            value: 1
      - expr: 'halro:ha_epoch_stable:bool{instance="one"}'
        eval_time: 6m
        exp_samples: []
      - expr: 'halro:ha_epoch_stable:bool{instance="one"}'
        eval_time: 8m
        exp_samples: []
      - expr: 'halro:ha_epoch_stable:bool{instance="one"}'
        eval_time: 12m
        exp_samples:
          - labels: 'halro:ha_epoch_stable:bool{environment="test",region="local",cluster="ha",instance="one"}'
            value: 1
