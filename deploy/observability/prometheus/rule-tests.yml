rule_files:
  - recording-rules.yml
  - alert-rules.yml

evaluation_interval: 1m

tests:
  # Duplicate target labels survive a Prometheus instant-vector lookback after
  # the second target stops. Keep the source alert independent of HA joins.
  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x9'
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",source="duplicate"}'
        values: '_ 1 1 _ _ _ _ _ _ _'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="primary"}'
        values: '1x9'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="primary",source="duplicate"}'
        values: '_ 1 1 _ _ _ _ _ _ _'
      - series: 'halro_cluster_term{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x9'
      - series: 'halro_cluster_term{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",source="duplicate"}'
        values: '_ 1 1 _ _ _ _ _ _ _'
      - series: 'halro_cluster_promised_term{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x9'
      - series: 'halro_cluster_promised_term{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",source="duplicate"}'
        values: '_ 1 1 _ _ _ _ _ _ _'
      - series: 'halro_cluster_incarnation_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",incarnation="inc_1"}'
        values: '1x9'
      - series: 'halro_cluster_incarnation_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",incarnation="inc_1",source="duplicate"}'
        values: '_ 1 1 _ _ _ _ _ _ _'
      - series: 'halro_cluster_member_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",cluster_id="ha",node_id="one"}'
        values: '1x9'
      - series: 'halro_cluster_member_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",cluster_id="ha",node_id="one",source="duplicate"}'
        values: '_ 1 1 _ _ _ _ _ _ _'
      - series: 'halro_replication_durable_index{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '0x9'
      - series: 'halro_replication_durable_index{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",source="duplicate"}'
        values: '_ 0 0 _ _ _ _ _ _ _'
      - series: 'halro_replication_confirmed_index{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '0x9'
      - series: 'halro_replication_confirmed_index{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",source="duplicate"}'
        values: '_ 0 0 _ _ _ _ _ _ _'
      - series: 'halro_replication_applied_index{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '0x9'
      - series: 'halro_replication_applied_index{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",source="duplicate"}'
        values: '_ 0 0 _ _ _ _ _ _ _'
    alert_rule_test:
      - eval_time: 0m
        alertname: HalroMemberDuplicateScrapeSource
        exp_alerts: []
      - eval_time: 2m
        alertname: HalroMemberDuplicateScrapeSource
        exp_alerts:
          - exp_labels: {alertname: HalroMemberDuplicateScrapeSource, category: ha, cluster: ha, environment: test, instance: one, owner: sre, region: local, service: halro, severity: critical}
            exp_annotations: {summary: Multiple Metrics scrape sources claim one Halro member, runbook_url: /docs/observability/operations-runbook.md#halromemberduplicatescrapesource}
      - eval_time: 2m
        alertname: HalroMultiplePrimaries
        exp_alerts: []
      - eval_time: 2m
        alertname: HalroMemberRoleAmbiguous
        exp_alerts: []
      - eval_time: 8m
        alertname: HalroMemberDuplicateScrapeSource
        exp_alerts: []
    promql_expr_test:
      - eval_time: 2m
        expr: 'halro:ha_epoch_stable:bool{instance="one"}'
        exp_samples: []
      - eval_time: 8m
        expr: 'halro:ha_epoch_stable:bool{instance="one"}'
        exp_samples:
          - labels: 'halro:ha_epoch_stable:bool{environment="test",region="local",cluster="ha",instance="one"}'
            value: 1

  - interval: 1m
    input_series:
      - series: 'halro_cluster_incarnation_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="replica-1",incarnation="inc_1"}'
        values: '1x5'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="replica-1",role="replica"}'
        values: '1x5'
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="replica-1"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: HalroNoPrimary
        exp_alerts: []
      - eval_time: 3m
        alertname: HalroNoPrimary
        exp_alerts:
          - exp_labels: {alertname: HalroNoPrimary, category: ha, cluster: ha, environment: test, owner: sre, region: local, service: halro, severity: critical}
            exp_annotations: {summary: No Halro member reports the Primary role, runbook_url: /docs/observability/operations-runbook.md#halronoprimary}

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="replica-1"}'
        values: '1x5'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="replica-1",role="replica"}'
        values: '1x5'
      - series: 'halro_cluster_role{job="other",expected_target="true",environment="test",region="local",cluster="ha",instance="noise",role="primary"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: HalroNoPrimary
        exp_alerts:
          - exp_labels: {alertname: HalroNoPrimary, category: ha, cluster: ha, environment: test, owner: sre, region: local, service: halro, severity: critical}
            exp_annotations: {summary: No Halro member reports the Primary role, runbook_url: /docs/observability/operations-runbook.md#halronoprimary}
      - eval_time: 3m
        alertname: HalroMultiplePrimaries
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x5'
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two"}'
        values: '1x5'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="replica"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: HalroNoPrimary
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x5'
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two"}'
        values: '1x5'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="replica"}'
        values: '1x5'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="rogue",role="replica"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: HalroNoPrimary
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x5'
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two"}'
        values: '1x5'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="replica"}'
        values: '1x5'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="awaiting_decision"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: HalroNoPrimary
        exp_alerts: []
      - eval_time: 0m
        alertname: HalroMemberRoleAmbiguous
        exp_alerts:
          - exp_labels: {alertname: HalroMemberRoleAmbiguous, category: ha, cluster: ha, environment: test, instance: one, owner: sre, region: local, service: halro, severity: critical}
            exp_annotations: {summary: A Halro member has conflicting role observations, runbook_url: /docs/observability/operations-runbook.md#halromemberroleambiguous}

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x5'
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two"}'
        values: '0x5'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="replica"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: HalroNoPrimary
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x3'
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two"}'
        values: '1x3'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="primary"}'
        values: '1x3'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two",role="primary"}'
        values: '1x3'
    alert_rule_test:
      - eval_time: 0m
        alertname: HalroMultiplePrimaries
        exp_alerts:
          - exp_labels: {alertname: HalroMultiplePrimaries, category: ha, cluster: ha, environment: test, owner: sre, region: local, service: halro, severity: critical}
            exp_annotations: {summary: Multiple Halro members report the Primary role, runbook_url: /docs/observability/operations-runbook.md#halromultipleprimaries}

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x7'
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two"}'
        values: '1x7'
      - series: 'halro_cluster_incarnation_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",incarnation="inc_1"}'
        values: '1x7'
      - series: 'halro_cluster_incarnation_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two",incarnation="inc_2"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 0m
        alertname: HalroMemberIncarnationConflict
        exp_alerts:
          - exp_labels: {alertname: HalroMemberIncarnationConflict, category: ha, cluster: ha, environment: test, owner: sre, region: local, service: halro, severity: critical}
            exp_annotations: {summary: Halro members report conflicting cluster incarnations, runbook_url: /docs/observability/operations-runbook.md#halromemberincarnationconflict}

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="missing"}'
        values: '1x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: HalroMemberIdentityMissing
        exp_alerts:
          - exp_labels: {alertname: HalroMemberIdentityMissing, category: ha, cluster: ha, environment: test, expected_target: "true", instance: missing, job: halro, owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: A scraped Halro member does not report its configured HA identity, runbook_url: /docs/observability/operations-runbook.md#halromemberidentitymissing}

  # A previous successful scrape must not fill an identity or role omitted by
  # a later successful scrape while the old series remains in lookback.
  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x4'
      - series: 'halro_cluster_member_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",cluster_id="ha",node_id="one"}'
        values: '1 _ _ 1 1'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="replica"}'
        values: '1 _ _ 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: HalroMemberIdentityMissing
        exp_alerts: []
      - eval_time: 2m
        alertname: HalroMemberIdentityMissing
        exp_alerts:
          - exp_labels: {alertname: HalroMemberIdentityMissing, category: ha, cluster: ha, environment: test, expected_target: "true", instance: one, job: halro, owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: A scraped Halro member does not report its configured HA identity, runbook_url: /docs/observability/operations-runbook.md#halromemberidentitymissing}
      - eval_time: 2m
        alertname: HalroMemberRoleMissing
        exp_alerts:
          - exp_labels: {alertname: HalroMemberRoleMissing, category: ha, cluster: ha, environment: test, expected_target: "true", instance: one, job: halro, owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: A scraped Halro member has no HA role observation, runbook_url: /docs/observability/operations-runbook.md#halromemberrolemissing}
      - eval_time: 3m
        alertname: HalroMemberIdentityMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: HalroMemberRoleMissing
        exp_alerts: []

  # Old Primary and incarnation label series must not fabricate conflicts or
  # hide a new no-Primary state after a later successful scrape.
  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x5'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="primary"}'
        values: '1 _ _ _ _ _'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="replica"}'
        values: '_ 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: HalroMemberRoleAmbiguous
        exp_alerts: []
      - eval_time: 3m
        alertname: HalroNoPrimary
        exp_alerts:
          - exp_labels: {alertname: HalroNoPrimary, category: ha, cluster: ha, environment: test, owner: sre, region: local, service: halro, severity: critical}
            exp_annotations: {summary: No Halro member reports the Primary role, runbook_url: /docs/observability/operations-runbook.md#halronoprimary}

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x4'
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two"}'
        values: '1x4'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="primary"}'
        values: '1 _ _ _ _'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",role="replica"}'
        values: '_ 1 1 1 1'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two",role="replica"}'
        values: '1 _ _ _ _'
      - series: 'halro_cluster_role{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two",role="primary"}'
        values: '_ 1 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: HalroMultiplePrimaries
        exp_alerts: []
      - eval_time: 1m
        alertname: HalroMemberRoleAmbiguous
        exp_alerts: []
      - eval_time: 3m
        alertname: HalroNoPrimary
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one"}'
        values: '1x4'
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two"}'
        values: '1x4'
      - series: 'halro_cluster_incarnation_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",incarnation="inc_1"}'
        values: '1 _ _ _ _'
      - series: 'halro_cluster_incarnation_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="one",incarnation="inc_2"}'
        values: '_ 1 1 1 1'
      - series: 'halro_cluster_incarnation_info{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="two",incarnation="inc_2"}'
        values: '1x4'
    alert_rule_test:
      - eval_time: 1m
        alertname: HalroMemberIncarnationConflict
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="halro",expected_target="true",environment="test",region="local",cluster="ha",instance="missing"}'
        values: '1x3'
      - series: 'halro_cluster_member_info{job="other",expected_target="true",environment="test",region="local",cluster="ha",instance="missing",cluster_id="ha",node_id="missing"}'
        values: '1x3'
      - series: 'halro_cluster_role{job="other",expected_target="true",environment="test",region="local",cluster="ha",instance="missing",role="replica"}'
        values: '1x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: HalroMemberIdentityMissing
        exp_alerts:
          - exp_labels: {alertname: HalroMemberIdentityMissing, category: ha, cluster: ha, environment: test, expected_target: "true", instance: missing, job: halro, owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: A scraped Halro member does not report its configured HA identity, runbook_url: /docs/observability/operations-runbook.md#halromemberidentitymissing}
      - eval_time: 2m
        alertname: HalroMemberRoleMissing
        exp_alerts:
          - exp_labels: {alertname: HalroMemberRoleMissing, category: ha, cluster: ha, environment: test, expected_target: "true", instance: missing, job: halro, owner: sre, region: local, service: halro, severity: warning}
            exp_annotations: {summary: A scraped Halro member has no HA role observation, runbook_url: /docs/observability/operations-runbook.md#halromemberrolemissing}

  - interval: 1m
