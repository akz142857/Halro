groups:
  - name: halro-alerts
    interval: 15s
    rules:
      # Two targets for one configured member make its HA metrics ambiguous.
      # This rule has no vector joins, so it still evaluates when other HA
      # rules cannot match the duplicate raw series.
      - alert: HalroMemberDuplicateScrapeSource
        expr: >-
          count by (environment, region, cluster, instance)
          (up{job="halro",expected_target="true"}) > 1
        for: 0m
        labels: {severity: critical, service: halro, owner: sre, category: ha}
        annotations:
          summary: Multiple Metrics scrape sources claim one Halro member
          runbook_url: /docs/observability/operations-runbook.md#halromemberduplicatescrapesource
      - alert: HalroNoPrimary
        expr: >-
          count by (environment, region, cluster)
          ((up{job="halro",expected_target="true"} == 1)
          and on (environment, region, cluster, instance)
          (count by (environment, region, cluster, instance)
          ((halro_cluster_role{job="halro",expected_target="true"} == 1)
          and on (environment, region, cluster, instance, role)
          (timestamp(halro_cluster_role{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))) == 1))
          == on (environment, region, cluster)
          count by (environment, region, cluster)
          (up{job="halro",expected_target="true"})
          unless on (environment, region, cluster)
          sum by (environment, region, cluster)
          ((halro_cluster_role{job="halro",expected_target="true",role="primary"} == 1)
          and on (environment, region, cluster, instance)
          (count by (environment, region, cluster, instance)
          (up{job="halro",expected_target="true"}) == 1)
          and on (environment, region, cluster, instance)
          (timestamp(halro_cluster_role{job="halro",expected_target="true",role="primary"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))))
          > 0
        for: 2m
        labels: {severity: critical, service: halro, owner: sre, category: ha}
        annotations:
          summary: No Halro member reports the Primary role
          runbook_url: /docs/observability/operations-runbook.md#halronoprimary
      - alert: HalroMultiplePrimaries
        expr: >-
          sum by (environment, region, cluster)
          ((halro_cluster_role{job="halro",expected_target="true",role="primary"} == 1)
          and on (environment, region, cluster, instance)
          (count by (environment, region, cluster, instance)
          (up{job="halro",expected_target="true"}) == 1)
          and on (environment, region, cluster, instance)
          (timestamp(halro_cluster_role{job="halro",expected_target="true",role="primary"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))) > 1
        for: 0m
        labels: {severity: critical, service: halro, owner: sre, category: ha}
        annotations:
          summary: Multiple Halro members report the Primary role
          runbook_url: /docs/observability/operations-runbook.md#halromultipleprimaries
      - alert: HalroMemberIncarnationConflict
        expr: >-
          count by (environment, region, cluster)
          (count by (environment, region, cluster, incarnation)
          ((halro_cluster_incarnation_info{job="halro",expected_target="true"} == 1)
          and on (environment, region, cluster, instance, incarnation)
          (timestamp(halro_cluster_incarnation_info{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))))) > 1
        for: 0m
        labels: {severity: critical, service: halro, owner: sre, category: ha}
        annotations:
          summary: Halro members report conflicting cluster incarnations
          runbook_url: /docs/observability/operations-runbook.md#halromemberincarnationconflict
      - alert: HalroMemberIdentityMissing
        expr: >-
          up{job="halro",expected_target="true"} == 1
          unless on (environment, region, cluster, instance)
          ((halro_cluster_member_info{job="halro",expected_target="true"} == 1)
          and on (environment, region, cluster, instance, cluster_id, node_id)
          (timestamp(halro_cluster_member_info{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))))
        for: 1m
        labels: {severity: warning, service: halro, owner: sre, category: ha}
        annotations:
          summary: A scraped Halro member does not report its configured HA identity
          runbook_url: /docs/observability/operations-runbook.md#halromemberidentitymissing
      - alert: HalroMemberRoleMissing
        expr: >-
          up{job="halro",expected_target="true"} == 1
          unless on (environment, region, cluster, instance)
          ((halro_cluster_role{job="halro",expected_target="true"} == 1)
          and on (environment, region, cluster, instance, role)
          (timestamp(halro_cluster_role{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))))
        for: 1m
        labels: {severity: warning, service: halro, owner: sre, category: ha}
        annotations:
          summary: A scraped Halro member has no HA role observation
          runbook_url: /docs/observability/operations-runbook.md#halromemberrolemissing
      - alert: HalroMemberRoleAmbiguous
        expr: >-
          count by (environment, region, cluster, instance)
          ((halro_cluster_role{job="halro",expected_target="true"} == 1)
          and on (environment, region, cluster, instance, role)
          (timestamp(halro_cluster_role{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))) > 1
          and on (environment, region, cluster, instance)
          (count by (environment, region, cluster, instance)
          (up{job="halro",expected_target="true"}) == 1)
        for: 0m
        labels: {severity: critical, service: halro, owner: sre, category: ha}
        annotations:
          summary: A Halro member has conflicting role observations
          runbook_url: /docs/observability/operations-runbook.md#halromemberroleambiguous
      # Instant selectors can retain a missing metric through Prometheus's
      # lookback; require the raw sample timestamp of each fixed signal to
      # match this member's latest successful up scrape.
      - alert: HalroMemberHASignalMissing
        expr: >-
          (up{job="halro",expected_target="true"} == 1)
          and on (environment, region, cluster, instance)
          (count by (environment, region, cluster, instance)
          (up{job="halro",expected_target="true"}) == 1)
          unless on (environment, region, cluster, instance)
          (
            (count by (environment, region, cluster, instance)
            (timestamp(halro_cluster_maintenance{job="halro",expected_target="true"})
            == on (environment, region, cluster, instance) group_left()
            max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))) == 1)
            and on (environment, region, cluster, instance)
            (count by (environment, region, cluster, instance)
            (timestamp(halro_cluster_term{job="halro",expected_target="true"})
            == on (environment, region, cluster, instance) group_left()
            max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))) == 1)
            and on (environment, region, cluster, instance)
            (count by (environment, region, cluster, instance)
            (timestamp(halro_cluster_promised_term{job="halro",expected_target="true"})
            == on (environment, region, cluster, instance) group_left()
            max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))) == 1)
            and on (environment, region, cluster, instance)
            (sum by (environment, region, cluster, instance)
            (count by (environment, region, cluster, instance, kind)
            (timestamp(halro_replication_index{job="halro",expected_target="true",kind=~"durable|confirmed|applied"})
            == on (environment, region, cluster, instance) group_left()
            max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))) == bool 1) == 3)
            and on (environment, region, cluster, instance)
            (count by (environment, region, cluster, instance)
            (timestamp(halro_replication_startup_ready{job="halro",expected_target="true"})
            == on (environment, region, cluster, instance) group_left()
            max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))) == 1)
            and on (environment, region, cluster, instance)
            (count by (environment, region, cluster, instance)
            (timestamp(halro_replication_unavailable{job="halro",expected_target="true"})
            == on (environment, region, cluster, instance) group_left()
            max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))) == 1)
            and on (environment, region, cluster, instance)
            (count by (environment, region, cluster, instance)
            (timestamp(halro_replication_member_incompatible{job="halro",expected_target="true",reason=~"schema|key_challenge|spki"})
            == on (environment, region, cluster, instance) group_left()
            max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))) == 3)
            and on (environment, region, cluster, instance)
            (
              count by (environment, region, cluster, instance)
              (timestamp(halro_replication_peer_connected{job="halro",expected_target="true"})
              == on (environment, region, cluster, instance) group_left()
              max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
              == on (environment, region, cluster) group_left()
              (count by (environment, region, cluster)
              (count by (environment, region, cluster, instance)
              (up{job="halro",expected_target="true"})) - 1)
            )
          )
        for: 1m
        labels: {severity: warning, service: halro, owner: sre, category: ha}
        annotations:
          summary: A scraped Halro member has an incomplete HA signal inventory
          runbook_url: /docs/observability/operations-runbook.md#halromemberhasignalmissing
      - alert: HalroTransitionJournalCapacityUnreadable
        expr: >-
          (
            (halro_replication_member_state_version{job="halro",expected_target="true"} == 3)
            and on (environment, region, cluster, instance)
            (up{job="halro",expected_target="true"} == 1)
            and on (environment, region, cluster, instance)
            (timestamp(halro_replication_member_state_version{job="halro",expected_target="true"})
            == on (environment, region, cluster, instance) group_left()
            max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          )
          unless on (environment, region, cluster, instance)
          (
            (halro_replication_transition_journal_capacity_readable{job="halro",expected_target="true"} == 1)
            and on (environment, region, cluster, instance)
            (timestamp(halro_replication_transition_journal_capacity_readable{job="halro",expected_target="true"})
            == on (environment, region, cluster, instance) group_left()
            max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          )
        for: 1m
        labels: {severity: warning, service: halro, owner: sre, category: ha}
        annotations:
          summary: A version-3 Halro member cannot account for its retained transition journal files
          runbook_url: /docs/observability/operations-runbook.md#halrotransitionjournalcapacityunreadable
      - alert: HalroMemberIdentityMismatch
        expr: >-
          ((halro_cluster_member_info{job="halro",expected_target="true"} == 1
          unless on (environment, region, cluster, instance, node_id)
          label_replace(count by (environment, region, cluster, instance)
          (halro_cluster_member_info{job="halro",expected_target="true"} == 1),
          "node_id", "$1", "instance", "(.+)"))
          or
          (halro_cluster_member_info{job="halro",expected_target="true"} == 1
          unless on (environment, region, cluster, instance, cluster_id)
          label_replace(count by (environment, region, cluster, instance)
          (halro_cluster_member_info{job="halro",expected_target="true"} == 1),
          "cluster_id", "$1", "cluster", "(.+)")))
          and on (environment, region, cluster, instance, cluster_id, node_id)
          (timestamp(halro_cluster_member_info{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
        for: 0m
        labels: {severity: critical, service: halro, owner: sre, category: ha}
        annotations:
          summary: A Halro member's self-reported identity disagrees with scrape inventory
          runbook_url: /docs/observability/operations-runbook.md#halromemberidentitymismatch
      - alert: HalroReplicationIndexOrderingInvalid
        expr: >-
          ((max by (environment, region, cluster, instance, job, expected_target)
          (halro_replication_durable_index{job="halro",expected_target="true"})
          < on (environment, region, cluster, instance)
          max by (environment, region, cluster, instance, job, expected_target)
          (halro_replication_confirmed_index{job="halro",expected_target="true"}))
          and on (environment, region, cluster, instance)
          (timestamp(halro_replication_durable_index{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (timestamp(halro_replication_confirmed_index{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))))
          and on (environment, region, cluster, instance)
          (count by (environment, region, cluster, instance)
          (up{job="halro",expected_target="true"}) == 1)
          or
          ((max by (environment, region, cluster, instance, job, expected_target)
          (halro_replication_confirmed_index{job="halro",expected_target="true"})
          < on (environment, region, cluster, instance)
          max by (environment, region, cluster, instance, job, expected_target)
          (halro_replication_applied_index{job="halro",expected_target="true"}))
          and on (environment, region, cluster, instance)
          (timestamp(halro_replication_confirmed_index{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (timestamp(halro_replication_applied_index{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))))
          and on (environment, region, cluster, instance)
          (count by (environment, region, cluster, instance)
          (up{job="halro",expected_target="true"}) == 1)
        for: 0m
        labels: {severity: critical, service: halro, owner: sre, category: ha}
        annotations:
          summary: A Halro member reports invalid durable/confirmed/applied ordering
          runbook_url: /docs/observability/operations-runbook.md#halroreplicationindexorderinginvalid
      - alert: HalroPromisedTermInvalid
        expr: >-
          max by (environment, region, cluster, instance, job, expected_target)
          (halro_cluster_promised_term{job="halro",expected_target="true"})
          < on (environment, region, cluster, instance)
          max by (environment, region, cluster, instance, job, expected_target)
          (halro_cluster_term{job="halro",expected_target="true"})
          and on (environment, region, cluster, instance)
          (timestamp(halro_cluster_promised_term{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (timestamp(halro_cluster_term{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (count by (environment, region, cluster, instance)
          (up{job="halro",expected_target="true"}) == 1)
        for: 0m
        labels: {severity: critical, service: halro, owner: sre, category: ha}
        annotations:
          summary: A Halro member reports a promise below its current term
          runbook_url: /docs/observability/operations-runbook.md#halropromisedterminvalid
      - alert: HalroReplicationIndexRegressed
        expr: >-
          delta(halro_replication_index{job="halro",expected_target="true"}[5m]) < 0
          and on (environment, region, cluster, instance)
          halro:ha_epoch_stable:bool == 1
          and on (environment, region, cluster, instance, kind)
          (timestamp(halro_replication_index{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (timestamp(halro_cluster_term{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (count by (environment, region, cluster, instance)
          (timestamp(halro_cluster_incarnation_info{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"}))) == 1)
        for: 0m
        labels: {severity: critical, service: halro, owner: sre, category: ha}
        annotations:
          summary: A Halro member's replication index regressed within one epoch
          runbook_url: /docs/observability/operations-runbook.md#halroreplicationindexregressed
      - alert: HalroAwaitingOperator
        expr: >-
          (halro_replication_startup_ready{job="halro",expected_target="true"} == 0)
          and on (environment, region, cluster, instance)
          (halro_cluster_role{job="halro",expected_target="true",role="primary"} == 1)
          and on (environment, region, cluster, instance)
          (timestamp(halro_replication_startup_ready{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (timestamp(halro_cluster_role{job="halro",expected_target="true",role="primary"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
        for: 2m
        labels: {severity: critical, service: halro, owner: sre, category: ha, role: primary}
        annotations:
          summary: A Halro member is waiting for startup role adjudication
          runbook_url: /docs/observability/operations-runbook.md#halroawaitingoperator
      - alert: HalroReplicationUnavailable
        expr: >-
          (halro_replication_unavailable{job="halro",expected_target="true"} == 1)
          and on (environment, region, cluster, instance)
          (halro_cluster_role{job="halro",expected_target="true",role="primary"} == 1)
          and on (environment, region, cluster, instance)
          (timestamp(halro_replication_unavailable{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (timestamp(halro_cluster_role{job="halro",expected_target="true",role="primary"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
        for: 1m
        labels: {severity: critical, service: halro, owner: sre, category: ha, role: primary}
        annotations:
          summary: The Halro Primary reports an internal replication block
          runbook_url: /docs/observability/operations-runbook.md#halroreplicationunavailable
      - alert: HalroReplicationNoConnectedPeer
        expr: >-
          sum by (environment, region, cluster, instance)
          (halro_replication_peer_connected{job="halro",expected_target="true"}
          and on (environment, region, cluster, instance, peer)
          (timestamp(halro_replication_peer_connected{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))) == 0
          and on (environment, region, cluster, instance)
          (count by (environment, region, cluster, instance)
          (timestamp(halro_replication_peer_connected{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          == on (environment, region, cluster) group_left()
          (count by (environment, region, cluster)
          (count by (environment, region, cluster, instance)
          (up{job="halro",expected_target="true"})) - 1))
          and on (environment, region, cluster, instance)
          (halro_cluster_role{job="halro",expected_target="true",role="primary"} == 1)
          and on (environment, region, cluster, instance)
          (timestamp(halro_cluster_role{job="halro",expected_target="true",role="primary"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
        for: 1m
        labels: {severity: critical, service: halro, owner: sre, category: ha, role: primary}
        annotations:
          summary: The Halro Primary has no authenticated Replica data session
          runbook_url: /docs/observability/operations-runbook.md#halroreplicationnoconnectedpeer
      - alert: HalroReplicationConfirmationStalled
        expr: >-
          halro_replication_confirmation_lag{job="halro",expected_target="true"} > 0
          and on (environment, region, cluster, instance)
          delta(halro_replication_confirmed_index{job="halro",expected_target="true"}[5m]) <= 0
          and on (environment, region, cluster, instance)
          halro_cluster_role{job="halro",expected_target="true",role="primary"} == 1
          and on (environment, region, cluster, instance)
          halro:ha_epoch_stable:bool == 1
          and on (environment, region, cluster, instance)
          (timestamp(halro_replication_confirmation_lag{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (timestamp(halro_replication_confirmed_index{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (timestamp(halro_cluster_role{job="halro",expected_target="true",role="primary"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
        for: 1m
        labels: {severity: warning, service: halro, owner: sre, category: ha, role: primary}
        annotations:
          summary: Durable Halro frames have not advanced to confirmed
          runbook_url: /docs/observability/operations-runbook.md#halroreplicationconfirmationstalled
      - alert: HalroReplicaApplyStalled
        expr: >-
          halro_replication_apply_backlog_frames{job="halro",expected_target="true"} > 0
          and on (environment, region, cluster, instance)
          delta(halro_replication_applied_index{job="halro",expected_target="true"}[5m]) <= 0
          and on (environment, region, cluster, instance)
          halro_cluster_role{job="halro",expected_target="true",role="replica"} == 1
          and on (environment, region, cluster, instance)
          halro:ha_epoch_stable:bool == 1
          and on (environment, region, cluster, instance)
          (timestamp(halro_replication_apply_backlog_frames{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (timestamp(halro_replication_applied_index{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
          and on (environment, region, cluster, instance)
          (timestamp(halro_cluster_role{job="halro",expected_target="true",role="replica"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
        for: 1m
        labels: {severity: warning, service: halro, owner: sre, category: ha, role: replica}
        annotations:
          summary: A Halro Replica has an unapplied backlog without apply progress
          runbook_url: /docs/observability/operations-runbook.md#halroreplicaapplystalled
      - alert: HalroMemberIncompatible
        expr: >-
          (halro_replication_member_incompatible{job="halro",expected_target="true"} == 1)
          and on (environment, region, cluster, instance, reason)
          (timestamp(halro_replication_member_incompatible{job="halro",expected_target="true"})
          == on (environment, region, cluster, instance) group_left()
          max by (environment, region, cluster, instance) (timestamp(up{job="halro",expected_target="true"})))
        for: 2m
        labels: {severity: critical, service: halro, owner: sre, category: ha}
        annotations:
          summary: A Halro member failed replication compatibility checks
          runbook_url: /docs/observability/operations-runbook.md#halromemberincompatible
      - alert: HalroTargetDown
        expr: up{job="halro",expected_target="true"} == 0 or absent(up{job="halro",expected_target="true"})
        for: 2m
        labels: {severity: critical, service: halro, owner: sre, category: availability}
        annotations:
          summary: Halro Metrics target is down
          runbook_url: /docs/observability/operations-runbook.md#halrotargetdown
      - alert: HalroClientObserverDown
        expr: up{job="halro-client-observer",expected_client_observer="true"} == 0
        for: 1m
        labels: {severity: warning, service: halro, owner: sre, category: ha}
        annotations:
          summary: An accepted client-final observer target is down
          runbook_url: /docs/observability/operations-runbook.md#halroclientobserverdown
      - alert: HalroClientObserverCoverageIncomplete
        expr: >-
          up{job="halro-client-observer",expected_client_observer="true"} == 1
          unless on (environment, region, cluster, instance)
          (
            (halro_ha_client_observer_ready{job="halro-client-observer",expected_client_observer="true"} == 1)
            and on (environment, region, cluster, instance)
            (
              timestamp(halro_ha_client_observer_ready{job="halro-client-observer",expected_client_observer="true"})
              == on (environment, region, cluster, instance)
              timestamp(up{job="halro-client-observer",expected_client_observer="true"})
            )
            and on (environment, region, cluster, instance)
            (halro_ha_client_observer_unreconciled_operations{job="halro-client-observer",expected_client_observer="true"} == 0)
            and on (environment, region, cluster, instance)
            (
              timestamp(halro_ha_client_observer_unreconciled_operations{job="halro-client-observer",expected_client_observer="true"})
              == on (environment, region, cluster, instance)
              timestamp(up{job="halro-client-observer",expected_client_observer="true"})
            )
          )
        for: 1m
        labels: {severity: warning, service: halro, owner: sre, category: ha}
        annotations:
          summary: A client-final observer is unready, unreconciled or missing its coverage gauges
          runbook_url: /docs/observability/operations-runbook.md#halroclientobservercoverageincomplete
      - alert: HalroConfigurationStale
        expr: halro_activation_stale == 1
        for: 1m
        labels: {severity: critical, service: halro, owner: sre, category: availability}
        annotations:
          summary: Halro is refusing traffic because a configuration snapshot is stale
          runbook_url: /docs/runbooks/configuration-stale.md
      - alert: HalroAuditAnchorStale
        expr: >-
          (
            time() - halro_audit_anchor_last_emit_timestamp_seconds
            > 3 * halro_audit_anchor_interval_seconds
            and halro_audit_anchor_last_emit_timestamp_seconds > 0
          )
          or
          (
            time() - process_start_time_seconds
            > 3 * halro_audit_anchor_interval_seconds
            and halro_audit_anchor_last_emit_timestamp_seconds == 0
          )
        # The expression already tolerates three intervals of silence; `for`
        # covers the sample-boundary flap where one scrape lands either side of
        # that threshold, which would otherwise page and resolve in a minute.
        for: 2m
        labels: {severity: critical, service: halro, owner: security, category: audit}
        annotations:
          summary: Halro audit anchor emission is stale
          runbook_url: /docs/observability/operations-runbook.md#halroauditanchorstale
      - alert: HalroAdminAuditBacklogStuck
        # An administrative mutation is durable together with its intent, and
        # the append happens afterwards. A backlog that drains is the ordinary
        # recovery from a crash between the two; a backlog that does not is
        # mutations still being accepted while the records describing them are
        # not landing. The audit anchor cannot see this at all — it witnesses
        # the chain that exists, not the records missing from it.
        expr: halro_admin_audit_intents_pending > 0
        # Long enough that a restart's drain finishes well inside it, short
        # enough that a trail going quiet is noticed the same shift.
        for: 15m
        labels: {severity: critical, service: halro, owner: security, category: audit}
        annotations:
          summary: Halro administrative mutations are committed with their audit records unwritten
          runbook_url: /docs/observability/operations-runbook.md#halroadminauditbacklogstuck
      - alert: HalroAdminAuditBacklogUnreadable
        # -1 is the deliberate value for a read that failed. Zero is the
        # healthy answer, so a store that cannot be read must not be able to
        # report it — an integrity signal that goes quiet when its source
        # breaks is worse than none.
        expr: halro_admin_audit_intents_pending < 0
        for: 5m
        labels: {severity: critical, service: halro, owner: security, category: audit}
        annotations:
          summary: Halro cannot read its administrative audit backlog
          runbook_url: /docs/observability/operations-runbook.md#halroadminauditbacklogunreadable
      - alert: HalroAdminAuditDeliveryFailing
        expr: increase(halro_admin_audit_delivery_failures_total[15m]) > 0
        labels: {severity: warning, service: halro, owner: security, category: audit}
        annotations:
          summary: Halro failed to append an administrative mutation's audit record
          runbook_url: /docs/observability/operations-runbook.md#halroadminauditdeliveryfailing
      - alert: HalroDeploymentCapabilityEvidenceDegraded
        expr: absent(halro_deployment_capability_status) or halro_deployment_capability_status{state="conflicting"} > 0
        labels: {severity: warning, service: halro, owner: sre, category: capability}
        annotations:
          summary: Halro deployment capability evidence is missing or conflicting
          runbook_url: /docs/observability/operations-runbook.md#halrodeploymentcapabilityevidencedegraded
      - alert: HalroWALAppendErrors
        expr: increase(halro_wal_append_errors_total[5m]) > 0
        for: 0m
        labels: {severity: critical, service: halro, owner: sre, category: accounting}
        annotations:
          summary: Halro WAL append errors increased
          runbook_url: /docs/observability/operations-runbook.md#halrowalappenderrors
      - alert: HalroShutdownTruncatedAttempts
        expr: increase(halro_shutdown_truncated_attempts_total[10m]) > 0
        labels: {severity: critical, service: halro, owner: sre, category: accounting}
        annotations:
          summary: Halro exhausted its shutdown budget with Provider attempts still active
          runbook_url: /docs/observability/operations-runbook.md#halroshutdowntruncatedattempts
      - alert: HalroAccountingLeaseStale
        expr: >-
          halro_accounting_pending_leases > 0
          and halro_accounting_oldest_pending_lease_age_seconds
          > halro_accounting_pending_lease_normal_max_age_seconds
        for: 2m
        labels: {severity: critical, service: halro, owner: sre, category: accounting}
        annotations:
          summary: A Halro Accounting Lease exceeded the configured request or stream duration
          runbook_url: /docs/observability/operations-runbook.md#halroaccountingleasestale
      - alert: HalroUsageAnalyticsLagging
        expr: halro_usage_analytics_lagging == 1
        for: 10m
        labels: {severity: warning, service: halro, owner: sre, category: accounting}
        annotations:
          summary: Halro Usage analytics is behind the Ledger
          runbook_url: /docs/observability/operations-runbook.md#halrousageanalyticslagging
      - alert: HalroLedgerQueueHigh
        expr: halro:ledger_queue:ratio > 0.75
        for: 5m
        labels: {severity: warning, service: halro, owner: sre, category: accounting}
        annotations:
          summary: Halro Ledger queue exceeds 75 percent
          runbook_url: /docs/observability/operations-runbook.md#halroledgerqueuehigh
      - alert: HalroAlertDeliveryFailing
        expr: increase(halro_alert_delivery_total{status=~"failed|dropped"}[10m]) > 0
        for: 10m
        labels: {severity: warning, service: halro, owner: sre, category: delivery}
        annotations:
          summary: Halro alert delivery is failing
          runbook_url: /docs/observability/operations-runbook.md#halroalertdeliveryfailing
      - alert: HalroDeploymentUnhealthy
        expr: halro_deployment_up == 0
        for: 5m
        labels: {severity: warning, service: halro, owner: sre, category: provider}
        annotations:
          summary: A probed Halro deployment is unhealthy
          runbook_url: /docs/observability/operations-runbook.md#halrodeploymentunhealthy
      - alert: HalroMultipleDeploymentsUnhealthy
        expr: halro:deployments_unhealthy:count >= 2
        for: 3m
        labels: {severity: critical, service: halro, owner: sre, category: provider}
        annotations:
          summary: Multiple Halro deployments are unhealthy
          runbook_url: /docs/observability/operations-runbook.md#halromultipledeploymentsunhealthy
      - alert: HalroCredentialUnusable
        expr: halro_route_suspended{reason=~"invalid_credential|subscription_inactive"} > 0
        for: 1m
        labels: {severity: critical, service: halro, owner: sre, category: provider}
        annotations:
          summary: A Halro Provider credential is refused upstream and will not recover on its own
          runbook_url: /docs/observability/operations-runbook.md#halrocredentialunusable
      - alert: HalroProviderQuotaExhausted
        expr: halro_route_suspended{reason="subscription_quota_exhausted"} > 0
        for: 5m
        labels: {severity: warning, service: halro, owner: sre, category: provider}
        annotations:
          summary: A Halro upstream has exhausted its quota
          runbook_url: /docs/observability/operations-runbook.md#halroproviderquotaexhausted
      - alert: HalroFallbackSaturation
        expr: halro:fallbacks:ratio5m > 0.25 and on (environment, region, cluster) increase(halro_requests_total[10m]) >= 20
        for: 5m
        labels: {severity: warning, service: halro, owner: sre, category: provider}
        annotations:
          summary: Halro fallback rate is elevated
          runbook_url: /docs/observability/operations-runbook.md#halrofallbacksaturation
      - alert: HalroProviderCapacityPressure
        expr: halro:provider_capacity:ratio > 0.85
        for: 5m
        labels: {severity: warning, service: halro, owner: sre, category: provider}
        annotations:
          summary: Halro Provider concurrency capacity is nearly exhausted
          runbook_url: /docs/observability/operations-runbook.md#halroprovidercapacitypressure
      - alert: HalroSignedModelCatalogDegraded
        expr: halro_signed_model_catalog_degraded == 1
        for: 15m
        labels: {severity: warning, service: halro, owner: sre, category: capability}
        annotations:
          summary: Halro signed model catalog refresh is degraded
          runbook_url: /docs/observability/operations-runbook.md#halrosignedmodelcatalogdegraded
      - alert: HalroCapabilityDriftDetected
        expr: increase(halro_capability_drift_total[1h]) > 0
        labels: {severity: warning, service: halro, owner: sre, category: capability}
        annotations:
          summary: Halro withheld a deployment because capability evidence drifted
          runbook_url: /docs/observability/operations-runbook.md#halrocapabilitydriftdetected
      - alert: HalroCapabilityDetectionFailureRateHigh
        expr: >-
          halro:capability_detection_failure:ratio1h > 0.5
          and on (environment, region, cluster, provider_type)
          sum by (environment, region, cluster, provider_type)
          (increase(halro_model_capability_detection_total[1h])) >= 5
        labels: {severity: warning, service: halro, owner: sre, category: capability}
        annotations:
          summary: Halro capability detection failure rate exceeds 50 percent
          runbook_url: /docs/observability/operations-runbook.md#halrocapabilitydetectionfailureratehigh
      - alert: HalroHighErrorRate
        expr: halro:requests_errors:ratio5m > 0.05 and on (environment, region, cluster) increase(halro_requests_total[10m]) >= 20
        for: 10m
        labels: {severity: warning, service: halro, owner: sre, category: traffic}
        annotations:
          summary: Halro request error rate is elevated
          runbook_url: /docs/observability/operations-runbook.md#halrohigherrorrate
      - alert: HalroKMSPrimaryUnlockFailure
        expr: increase(halro_kms_calls_total{operation="unwrap",status="error"}[5m]) > 0
        labels: {severity: critical, service: halro, owner: sre, category: key-custody}
        annotations:
          summary: Halro Primary KMS unlock failed
          runbook_url: /docs/runbooks/m11-production-operations.md
      - alert: HalroKMSRecoveryNotReady
        expr: halro_kms_recovery_ready == 0
        for: 5m
        labels: {severity: critical, service: halro, owner: sre, category: key-custody}
        annotations:
          summary: Halro Recovery Slot is not active and verified
          runbook_url: /docs/runbooks/m11-production-operations.md
      - alert: HalroKMSRecoveryVerificationExpired
        expr: time() - halro_kms_slot_verified_timestamp_seconds{purpose="recovery"} > 7776000
        for: 5m
        labels: {severity: warning, service: halro, owner: sre, category: key-custody}
        annotations:
          summary: Halro Recovery Slot verification is older than 90 days
          runbook_url: /docs/runbooks/m11-production-operations.md
      - alert: HalroKMSRecoveryUsed
        expr: halro_kms_recovery_last_used_timestamp_seconds > 0 and time() - halro_kms_recovery_last_used_timestamp_seconds < 900
        labels: {severity: critical, service: halro, owner: sre, category: key-custody}
        annotations:
          summary: Halro Recovery Slot was used
          runbook_url: /docs/runbooks/m11-production-operations.md
      - alert: HalroKMSVaultMismatch
        expr: increase(halro_kms_unlock_total{error_class="kms_vault_mismatch",status="error"}[5m]) > 0
        labels: {severity: critical, service: halro, owner: security, category: key-custody}
        annotations:
          summary: KMS returned a key that does not match the Halro Vault
          runbook_url: /docs/runbooks/m11-production-operations.md
      - alert: HalroKMSPendingRotation
        expr: halro_kms_pending_rotation_slots > 0
        for: 15m
        labels: {severity: warning, service: halro, owner: sre, category: key-custody}
        annotations:
          summary: Halro Key Slot rotation remains pending
          runbook_url: /docs/runbooks/m11-production-operations.md
      - alert: Watchdog
        expr: vector(1)
        labels: {severity: none, service: halro, owner: sre, category: deadman}
        annotations:
          summary: Continuous signal for an independent dead-man monitor
          runbook_url: /docs/observability/operations-runbook.md#watchdog

  - name: observability-platform
    rules:
      - alert: AlertmanagerNotificationFailing
        expr: increase(alertmanager_notifications_failed_total[5m]) > 0
        for: 2m
        labels: {severity: critical, service: alertmanager, owner: sre, category: platform}
        annotations: {summary: Alertmanager notifications are failing, runbook_url: /docs/observability/operations-runbook.md#alertmanagernotificationfailing}
      - alert: PrometheusRuleEvaluationFailing
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 2m
        labels: {severity: warning, service: prometheus, owner: sre, category: platform}
        annotations: {summary: Prometheus rule evaluation is failing, runbook_url: /docs/observability/operations-runbook.md#prometheusruleevaluationfailing}
      - alert: PrometheusConfigReloadFailing
        expr: prometheus_config_last_reload_successful == 0
        for: 2m
        labels: {severity: critical, service: prometheus, owner: sre, category: platform}
        annotations: {summary: Prometheus configuration reload failed, runbook_url: /docs/observability/operations-runbook.md#prometheusconfigreloadfailing}
      - alert: PrometheusTSDBDiskHigh
        expr: >-
          prometheus_tsdb_storage_blocks_bytes
          + prometheus_tsdb_wal_storage_size_bytes > 3758096384
        for: 10m
        labels: {severity: warning, service: prometheus, owner: sre, category: platform}
        annotations: {summary: Prometheus TSDB and WAL exceed the local 3.5 GiB warning budget, runbook_url: /docs/observability/operations-runbook.md#prometheustsdbdiskhigh}
      - alert: PrometheusTSDBDiskCritical
        expr: >-
          prometheus_tsdb_storage_blocks_bytes
          + prometheus_tsdb_wal_storage_size_bytes > 4563402752
        for: 5m
        labels: {severity: critical, service: prometheus, owner: sre, category: platform}
        annotations: {summary: Prometheus TSDB and WAL exceed the local 4.25 GiB critical budget, runbook_url: /docs/observability/operations-runbook.md#prometheustsdbdiskcritical}
      # Thresholds below are starting points, not universal truths: fsync cost
      # spans orders of magnitude between filesystems, so re-baseline them per
      # host from halro:wal_sync:mean5m before trusting them.
      # Spend control. There is no threshold in this file, and that is the
      # point: the budget already exists as `Project.DailyBudgetMicrosUSD`,
      # set per Project in the Admin console, stored durably and enforced
      # before any upstream is called — a request past it is refused, not
      # merely noted. What was missing was never a budget. It was that nothing
      # watched the one Halro already had (260918-PV-F-07).
      #
      # So these alert on the refusal itself, which needs no number: a Project
      # hitting the cap its operator set is a fact Halro already counts.
      # Approaching-the-cap would need per-Project spend as a series, and that
      # is a label whose cardinality grows with the customer list.
      #
      # The per-minute cost guard is already covered elsewhere: a Token Guard
      # policy with `cost_micros_per_minute` raises its own alert through
      # Halro's webhook dispatcher, with the Project on the event.
      - alert: HalroProjectDailyBudgetRefusingTraffic
        expr: increase(halro_policy_rejections_total{reason="budget"}[1h]) > 0
        for: 5m
        labels: {severity: warning, service: halro, owner: product, category: cost}
        annotations:
          summary: A Halro Project reached its daily budget and requests are being refused
          runbook_url: /docs/observability/operations-runbook.md#halroprojectdailybudgetrefusingtraffic
      - alert: HalroRunBudgetRefusingTraffic
        expr: increase(halro_policy_rejections_total{reason="run_budget"}[1h]) > 0
        for: 5m
        labels: {severity: warning, service: halro, owner: product, category: cost}
        annotations:
          summary: A Halro Run reached its budget and requests are being refused
          runbook_url: /docs/observability/operations-runbook.md#halrorunbudgetrefusingtraffic
      # Spend that stops being reported is not spend that stopped. The counter
      # is restored from the usage checkpoint and rebuilt from the Ledger, so
      # its absence means the metrics path or the accounting aggregate is
      # broken — and every cost signal above is silent while it is.
      - alert: HalroProviderSpendUnreported
        expr: absent(halro_cost_usd_total)
        for: 10m
        labels: {severity: critical, service: halro, owner: sre, category: cost}
        annotations:
          summary: Halro is not reporting Provider spend at all
          runbook_url: /docs/observability/operations-runbook.md#halroproviderspendunreported
      - alert: HalroWALSyncSlow
        expr: halro:wal_sync:mean5m > 0.05
        for: 10m
        labels: {severity: warning, service: halro, owner: sre, category: accounting}
        annotations:
          summary: Halro Ledger fsync is slow enough to cap accounting throughput
          runbook_url: /docs/observability/operations-runbook.md#halrowalsyncslow
      - alert: HalroAccountingProjectLockSaturated
        expr: halro:accounting_project_lock_wait:mean5m > 0.25
        for: 15m
        labels: {severity: warning, service: halro, owner: sre, category: accounting}
        annotations:
          summary: Halro requests are queueing on one project's accounting lock
          runbook_url: /docs/observability/operations-runbook.md#halroaccountingprojectlocksaturated
      # Certificate lifetime is measured against the scrape's own clock rather
      # than a recorded rule, so a stopped Halro produces no series and is
      # covered by HalroTargetDown instead of firing here as well.
      - alert: HalroTLSCertificateExpiringSoon
        expr: (halro_tls_certificate_expiry_seconds - time()) < 2592000
        for: 15m
        labels: {severity: warning, service: halro, owner: sre, category: availability}
        annotations:
          summary: A Halro TLS certificate expires within 30 days
          runbook_url: /docs/observability/operations-runbook.md#halrotlscertificateexpiringsoon
      - alert: HalroTLSCertificateExpired
        expr: (halro_tls_certificate_expiry_seconds - time()) <= 0
        for: 5m
        labels: {severity: critical, service: halro, owner: sre, category: availability}
        annotations:
          summary: A Halro TLS certificate has expired and clients are being refused
          runbook_url: /docs/observability/operations-runbook.md#halrotlscertificateexpired
      # A failed reload means the process kept what it had, so this is a warning
      # about drift between the files on disk and what is in force — not an
      # outage. The paired expiry alerts above are what catch the consequence if
      # the drift is a certificate that never got replaced.
      - alert: HalroReloadFailing
        expr: increase(halro_reload_total{status="error"}[15m]) > 0
        for: 5m
        labels: {severity: warning, service: halro, owner: sre, category: availability}
        annotations:
          summary: A Halro SIGHUP reload item is failing and the previous value is still in force
          runbook_url: /docs/observability/operations-runbook.md#halroreloadfailing
