groups:
  - name: halro-recording
    interval: 15s
    rules:
      - record: halro:requests:rate5m
        expr: >-
          sum by (environment, region, cluster)
          (rate(halro_requests_total[5m]))
      - record: halro:requests_errors:ratio5m
        expr: >-
          sum by (environment, region, cluster)
          (rate(halro_requests_total{status="error"}[5m]))
          /
          clamp_min(sum by (environment, region, cluster)
          (rate(halro_requests_total[5m])), 0.001)
      - record: halro:request_duration:mean5m
        expr: >-
          sum by (environment, region, cluster)
          (rate(halro_request_duration_seconds_sum[5m]))
          /
          clamp_min(sum by (environment, region, cluster)
          (rate(halro_request_duration_seconds_count[5m])), 0.001)
      - record: halro:request_duration_instance:mean5m
        expr: >-
          sum by (environment, region, cluster, instance)
          (rate(halro_request_duration_seconds_sum[5m]))
          /
          clamp_min(sum by (environment, region, cluster, instance)
          (rate(halro_request_duration_seconds_count[5m])), 0.001)
      - record: halro:ledger_queue:ratio
        expr: >-
          (halro_usage_queue_depth / halro_usage_queue_capacity)
          and on (environment, region, cluster, instance)
          (halro_usage_queue_capacity > 0)
      - record: halro:fallbacks:ratio5m
        expr: >-
          sum by (environment, region, cluster)
          (rate(halro_fallbacks_total[5m]))
          /
          clamp_min(sum by (environment, region, cluster)
          (rate(halro_requests_total[5m])), 0.001)
      - record: halro:deployments_unhealthy:count
        expr: >-
          count by (environment, region, cluster)
          (halro_deployment_up == 0)
      - record: halro:provider_capacity:ratio
        expr: >-
          max by (environment, region, cluster, provider_id)
          (halro_provider_active_requests
          / halro_provider_concurrency_limit)
          and on (environment, region, cluster, provider_id)
          (halro_provider_concurrency_limit > 0)
      - record: halro:capability_detection_failure:ratio1h
        expr: >-
          sum by (environment, region, cluster, provider_type)
          (increase(halro_model_capability_detection_total{status=~"failed|interrupted"}[1h]))
          /
          clamp_min(sum by (environment, region, cluster, provider_type)
          (increase(halro_model_capability_detection_total[1h])), 1)
      # Durable write path. These four are the capacity story for this process:
      # every accounting ceiling is bounded by an fsync, and the group-commit
      # sizes say whether the host or the offered concurrency is the limit.
      - record: halro:wal_sync:mean5m
        expr: >-
          sum by (environment, region, cluster, instance)
          (rate(halro_wal_sync_seconds_sum[5m]))
          /
          clamp_min(sum by (environment, region, cluster, instance)
          (rate(halro_wal_sync_seconds_count[5m])), 0.001)
      # Records per batch. Near 1.0 under load means appends are not coalescing:
      # either too few concurrent appenders, or they are serialized upstream of
      # the WAL — which is what the per-project accounting lock does (ADR 0018).
      - record: halro:wal_batch_size:mean5m
        expr: >-
          sum by (environment, region, cluster, instance)
          (rate(halro_wal_append_records_total[5m]))
          /
          clamp_min(sum by (environment, region, cluster, instance)
          (rate(halro_wal_append_batches_total[5m])), 0.001)
      - record: halro:accounting_project_lock_wait:mean5m
        expr: >-
          sum by (environment, region, cluster, instance)
          (rate(halro_accounting_project_lock_wait_seconds_sum[5m]))
          /
          clamp_min(sum by (environment, region, cluster, instance)
          (rate(halro_accounting_project_lock_wait_seconds_count[5m])), 0.001)
      # Calls per metadata write transaction, the bbolt counterpart of
      # wal_batch_size.
      - record: halro:metadata_batch_size:mean5m
        expr: >-
          sum by (environment, region, cluster, instance)
          (rate(halro_metadata_batch_calls_total[5m]))
          /
          clamp_min(sum by (environment, region, cluster, instance)
          (rate(halro_metadata_batch_transactions_total[5m])), 0.001)
