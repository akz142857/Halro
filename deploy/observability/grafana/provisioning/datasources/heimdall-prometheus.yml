apiVersion: 1

deleteDatasources:
  - name: Heimdall Prometheus
    orgId: 1

datasources:
  - name: Heimdall Prometheus
    uid: heimdall-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9091
    orgId: 1
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: false
      prometheusType: Prometheus
      timeInterval: 15s
