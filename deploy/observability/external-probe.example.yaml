# Run this stack only on an independently operated host/failure domain.
services:
  halro-independent-deadman:
    build:
      context: ../..
      dockerfile: deploy/observability/external-probe/Dockerfile
    image: halro-deadman:local
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: [-config, /etc/halro-deadman/config.yaml]
    volumes:
      - ./external-probe/config.example.yaml:/etc/halro-deadman/config.yaml:ro
      - /run/halro-deadman:/run/halro-deadman:ro
      - deadman-state:/var/lib/halro-deadman
      - deadman-audit:/var/log/halro-deadman
    restart: always
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  deadman-state: {}
  deadman-audit: {}
