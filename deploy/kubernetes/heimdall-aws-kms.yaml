apiVersion: v1
kind: ServiceAccount
metadata:
  name: heimdall
  namespace: heimdall
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heimdall
  namespace: heimdall
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: heimdall}
  template:
    metadata:
      labels: {app.kubernetes.io/name: heimdall}
    spec:
      serviceAccountName: heimdall
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: heimdall
          image: ghcr.io/OWNER/heimdall@sha256:REPLACE_WITH_REVIEWED_DIGEST
          args: ["start", "--config", "/etc/heimdall/config.yaml"]
          ports:
            - {name: gateway, containerPort: 8080}
            - {name: admin, containerPort: 8081}
            - {name: metrics, containerPort: 9090}
          readinessProbe:
            exec: {command: ["/usr/local/bin/heimdall", "healthcheck", "--url", "http://127.0.0.1:8080/health/ready"]}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec: {command: ["/usr/local/bin/heimdall", "healthcheck", "--url", "http://127.0.0.1:8080/health/live"]}
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/heimdall, readOnly: true}
            - {name: data, mountPath: /var/lib/heimdall}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          secret: {secretName: heimdall-config, defaultMode: 0400}
        - name: data
          persistentVolumeClaim: {claimName: heimdall-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
