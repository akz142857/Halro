# Object-shape example only. This placeholder intentionally fails Halro's
# setup-token envelope validation. Do not commit a real token; generate a private
# file with `halro admin setup-token generate --output` and let the approved
# secret manager or `kubectl create secret --from-file` ingest it.
apiVersion: v1
kind: Secret
metadata:
  name: halro-bootstrap
  namespace: halro
type: Opaque
stringData:
  setup-token: REPLACE_VIA_SECRET_MANAGER
