apiVersion: v1
kind: ServiceAccount
metadata:
  name: halro
  namespace: halro
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halro
  namespace: halro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: halro}
  template:
    metadata:
      labels: {app.kubernetes.io/name: halro}
    spec:
      serviceAccountName: halro
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The default server.shutdown_timeout is 120s. Leave process and
      # container-runtime cleanup headroom beyond Halro's own drain budget.
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: halro
          # Halro 1.0.0 has no official registry. Load the signed release image
          # archive, push it to an operator-controlled registry, and replace
          # both OWNER and REPLACE_WITH_REVIEWED_DIGEST before deployment.
          image: ghcr.io/OWNER/halro@sha256:REPLACE_WITH_REVIEWED_DIGEST
          # Apply deploy/kubernetes/halro-init-job.yaml first and wait for its
          # Complete condition. Runtime never initializes a new production PVC.
          args: ["serve", "--config", "/etc/halro/config.yaml"]
          env:
            # Never fall back from the intended Pod identity to an EC2 node role.
            - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
          ports:
            - {name: gateway, containerPort: 8080}
            - {name: admin, containerPort: 8081}
            - {name: metrics, containerPort: 9090}
          # This production example assumes tls.enabled=true on the gateway.
          # Kubernetes HTTPS probes do not validate the serving certificate.
          # Change all three schemes to HTTP only when TLS is deliberately
          # terminated before Halro and the Pod listener is configured HTTP.
          startupProbe:
            httpGet: {path: /health/live, port: gateway, scheme: HTTPS}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health/ready, port: gateway, scheme: HTTPS}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /health/live, port: gateway, scheme: HTTPS}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # Admin password verification runs Argon2id at 64 MiB per operation.
          # Halro admits at most two Argon2 operations process-wide, so this
          # part of the working set is bounded at about 128 MiB and additional
          # login or step-up requests wait for a slot. With replicas fixed at 1
          # and a Recreate strategy, an OOMKill still takes the gateway with it;
          # size this above the observed baseline plus that 128 MiB bound rather
          # than by steady-state usage alone.
          #
          # The other term, and the one that scales: the console window is held
          # in memory at roughly a kilobyte per attempt, so a thirty-day window
          # is about 0.27 GB at 0.1 requests a second and about 27 GB at ten.
          # The limit below fits a small install — well under one request a
          # second at the default window. Raise it, or shorten
          # usage.console_window_days, before running anything busier; the
          # operator guide has the table.
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/halro, readOnly: true}
            # The Secret is optional only so an already initialized instance
            # can be rescheduled after bootstrap cleanup. With zero admins,
            # Halro still fails closed when this configured file is absent.
            - {name: admin-bootstrap, mountPath: /run/secrets/halro, readOnly: true}
            - {name: data, mountPath: /var/lib/halro}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          secret: {secretName: halro-config, defaultMode: 0440}
        - name: admin-bootstrap
          secret:
            secretName: halro-bootstrap
            optional: true
            defaultMode: 0440
        - name: data
          persistentVolumeClaim: {claimName: halro-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
