apiVersion: v1
kind: ServiceAccount
metadata:
  name: halro
  namespace: halro
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halro
  namespace: halro
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: halro}
  template:
    metadata:
      labels: {app.kubernetes.io/name: halro}
    spec:
      serviceAccountName: halro
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: halro
          image: ghcr.io/OWNER/halro@sha256:REPLACE_WITH_REVIEWED_DIGEST
          args: ["start", "--config", "/etc/halro/config.yaml"]
          ports:
            - {name: gateway, containerPort: 8080}
            - {name: admin, containerPort: 8081}
            - {name: metrics, containerPort: 9090}
          readinessProbe:
            exec: {command: ["/usr/local/bin/halro", "healthcheck", "--url", "http://127.0.0.1:8080/health/ready"]}
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec: {command: ["/usr/local/bin/halro", "healthcheck", "--url", "http://127.0.0.1:8080/health/live"]}
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # Admin password verification runs Argon2id at 64 MiB per concurrent
          # check, and nothing bounds how many run at once, so the memory limit
          # is also a cap on how many simultaneous logins or step-ups the pod
          # survives: at 512Mi, roughly eight. With replicas fixed at 1 and a
          # Recreate strategy, an OOMKill here takes the gateway with it. Size
          # this as (baseline + 64Mi x expected concurrent credential checks)
          # rather than by steady-state usage, which is far lower.
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/halro, readOnly: true}
            - {name: data, mountPath: /var/lib/halro}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          secret: {secretName: halro-config, defaultMode: 0400}
        - name: data
          persistentVolumeClaim: {claimName: halro-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
