# @title.zh-CN 配置版本
# @title.en-US Configuration version
# @description.zh-CN 配置文件的结构版本。
# @description.en-US Schema version of this configuration file.
version: 2

server:
  # @title.zh-CN Gateway 监听地址
  # @title.en-US Gateway listen address
  # @description.zh-CN Gateway 接收模型请求的监听地址。
  # @description.en-US Listener address for model requests.
  gateway_listen: "127.0.0.1:8080"
  # @title.zh-CN 管理端监听地址
  # @title.en-US Admin listen address
  # @description.zh-CN Admin API 与管理界面的监听地址。
  # @description.en-US Listener address for the Admin API and console.
  admin_listen: "127.0.0.1:8081"
  # @title.zh-CN 指标监听地址
  # @title.en-US Metrics listen address
  # @description.zh-CN Prometheus 指标服务的监听地址。
  # @description.en-US Listener address for the Prometheus metrics service.
  metrics_listen: "127.0.0.1:9090"
  # @title.zh-CN 请求头读取超时
  # @title.en-US Header read timeout
  # @description.zh-CN 完整读取入站请求头允许的最长时间。
  # @description.en-US Maximum time allowed to read inbound request headers.
  read_header_timeout: 5s
  # @title.zh-CN 请求体读取超时
  # @title.en-US Body read timeout
  # @description.zh-CN 完整读取入站请求体允许的最长时间。
  # @description.en-US Maximum time allowed to read an inbound request body.
  read_body_timeout: 15s
  # @title.zh-CN 优雅关闭超时
  # @title.en-US Graceful shutdown timeout
  # @description.zh-CN 所有监听器共享的关闭预算，必须不短于 gateway.route_total_timeout，
  # @description.zh-CN 否则已受理的请求来不及走完。
  # @description.en-US Shared listener shutdown budget. It must be at least
  # @description.en-US gateway.route_total_timeout, or accepted requests cannot drain.
  shutdown_timeout: 120s
  # @title.zh-CN 最大请求头大小
  # @title.en-US Maximum header size
  # @description.zh-CN 单个请求头允许的最大字节数。
  # @description.zh-CN 至少 1024。
  # @description.en-US Maximum header bytes accepted for one request.
  # @description.en-US At least 1024.
  max_header_bytes: 32768
  # @title.zh-CN 最大请求大小
  # @title.en-US Maximum request size
  # @description.zh-CN 单个非流式请求允许的最大字节数。
  # @description.en-US Maximum bytes accepted for one non-streaming request.
  max_request_bytes: 10485760

tls:
  # @title.zh-CN Gateway TLS
  # @title.en-US Gateway TLS
  # @description.zh-CN 是否为 Gateway 入站连接启用 TLS。
  # @description.en-US Enables TLS for inbound Gateway connections.
  enabled: false
  # @title.zh-CN TLS 证书列表
  # @title.en-US TLS certificate list
  # @description.zh-CN 每项一对证书链与私钥文件。第一项用于没有 SNI 的连接；其余各项按证书声明的名字选择，因此 Gateway 与 Admin 可以使用不同域名。
  # @description.en-US One certificate chain and private key per entry. The first entry answers connections that arrive without SNI; every other entry is selected by the names its certificate declares, so Gateway and Admin may use different hostnames.
  certificates: []

storage:
  # @title.zh-CN 数据目录
  # @title.en-US Data directory
  # @description.zh-CN Halro 持久化运行数据的根目录。
  # @description.en-US Root directory for Halro runtime data.
  data_dir: "./data"
  # @title.zh-CN 元数据文件
  # @title.en-US Metadata file
  # @description.zh-CN 相对于数据目录的元数据库文件名。
  # @description.en-US Metadata database filename relative to the data directory.
  metadata_file: "halro.db"
  master_key:
    # @title.zh-CN 主密钥来源
    # @title.en-US Master-key source
    # @description.zh-CN 主密钥由本地文件或外部密钥槽提供。
    # @description.en-US Selects a local file or external key slots as the master-key source.
    mode: file
    # @title.zh-CN 主密钥文件
    # @title.en-US Master-key file
    # @description.zh-CN file 模式使用的主密钥文件路径。
    # @description.zh-CN key_slots 模式下不得设置。
    # @description.en-US Master-key file path used in file mode.
    # @description.en-US It cannot be set in key_slots mode.
    file: "./master.key"
    # Everything below belongs to mode: key_slots, where the Master Key is held
    # by a cloud KMS instead of by this host. The keys are commented out
    # because validation refuses to see them set together with `file`.
    #
    # To switch: set mode to key_slots, comment `file` out, and uncomment only
    # the lines that read `key: value` — leave the `# @title` and
    # `# @description` lines commented. They are the console's field metadata
    # and are meant to stay comments; they attach themselves to the keys below
    # them once those keys are live.
    #
    # See docs/guides/operator-guide.md before doing so — non-repudiation of
    # the audit chain assumes this mode.
    #
    # @title.zh-CN 主用密钥槽
    # @title.en-US Primary key slot
    # @description.zh-CN key_slots 模式下日常解封主密钥的槽标识；必须与恢复槽不同。
    # @description.en-US Slot identifier that unwraps the Master Key in normal operation; must differ from the recovery slot.
    # primary_slot: "halro-primary"
    # @title.zh-CN 恢复密钥槽
    # @title.en-US Recovery key slot
    # @description.zh-CN 主用槽不可用时使用的独立槽；必须由独立的 KMS 密钥支撑，否则两者同时失效。
    # @description.en-US Independent slot used when the primary is unavailable; back it with a separate KMS key or both fail together.
    # recovery_slot: "halro-recovery"
    # @title.zh-CN 解封启动期限
    # @title.en-US Unwrap startup deadline
    # @description.zh-CN 启动时解封主密钥的总期限；超时即拒绝启动，不降级运行。
    # @description.en-US Total deadline for unwrapping the Master Key at startup; exceeding it refuses to start rather than running degraded.
    # startup_deadline: "30s"
    # @title.zh-CN 单次 KMS 调用超时
    # @title.en-US Single KMS call timeout
    # @description.zh-CN 单次 KMS 调用的超时，必须为正且小于 startup_deadline，否则一次挂起的调用会吃掉整个启动期限。
    # @description.en-US Timeout for one KMS call; must be positive and less than startup_deadline, or a single hung call consumes the whole startup budget.
    # call_timeout: "10s"
    # @title.zh-CN KMS 密钥允许清单
    # @title.en-US KMS key allowlist
    # @description.zh-CN 本实例允许使用的 KMS 密钥；必须恰好包含 primary 与 recovery 各一条。清单之外的密钥即使 IAM 放行也会被拒绝。
    # @description.en-US KMS keys this instance may use; exactly one primary and one recovery entry are required. A key outside the list is refused even where IAM would allow it.
    # allowed_kms_keys:
    #     # @title.zh-CN 密钥用途
    #     # @title.en-US Key purpose
    #     # @description.zh-CN 取值 primary 或 recovery，两者各须恰好出现一次。
    #     # @description.en-US Either primary or recovery; each must appear exactly once.
    #   - purpose: "primary"
    #     # @title.zh-CN KMS 提供方
    #     # @title.en-US KMS provider
    #     # @description.zh-CN 本版本仅支持 aws-kms。
    #     # @description.en-US Only aws-kms is available in this release.
    #     provider: "aws-kms"
    #     # @title.zh-CN 区域
    #     # @title.en-US Region
    #     # @description.zh-CN AWS 区域，必须与 key_id 这个 ARN 中的区域一致。
    #     # @description.en-US AWS region; must match the region inside the key_id ARN.
    #     region: "us-east-1"
    #     # @title.zh-CN 账号
    #     # @title.en-US Account
    #     # @description.zh-CN 12 位 AWS 账号，必须与 key_id 这个 ARN 中的账号一致。
    #     # @description.en-US Twelve-digit AWS account; must match the account inside the key_id ARN.
    #     account: "123456789012"
    #     # @title.zh-CN 密钥 ARN
    #     # @title.en-US Key ARN
    #     # @description.zh-CN 完整的 KMS Key ARN；别名或裸 key id 会被拒绝，因为它们可以在不改配置的情况下被指向另一把密钥。
    #     # @description.en-US Full KMS Key ARN; an alias or bare key id is refused, because either can be repointed at a different key without the configuration changing.
    #     key_id: "arn:aws:kms:us-east-1:123456789012:key/00000000-0000-0000-0000-000000000000"
    #     # @title.zh-CN 自定义端点
    #     # @title.en-US Custom endpoint
    #     # @description.zh-CN 可选的 VPC 端点或私有链路地址；留空使用该区域的默认端点。
    #     # @description.en-US Optional VPC endpoint or private link address; empty uses the region's default endpoint.
    #     endpoint: ""
    #     # @title.zh-CN 加密算法
    #     # @title.en-US Encryption algorithm
    #     # @description.zh-CN aws-kms 下留空即 SYMMETRIC_DEFAULT，也只接受这一个取值。
    #     # @description.en-US Empty means SYMMETRIC_DEFAULT under aws-kms, which is also the only accepted value.
    #     algorithm: ""
    #     # The recovery entry is not optional: the allowlist is refused without
    #     # exactly one of each purpose. Backing it with a key in another region
    #     # is the point of having it — one region's outage should not take the
    #     # recovery path with it.
    #   - purpose: "recovery"
    #     provider: "aws-kms"
    #     region: "us-west-2"
    #     account: "123456789012"
    #     key_id: "arn:aws:kms:us-west-2:123456789012:key/11111111-1111-1111-1111-111111111111"
    #     endpoint: ""
    #     algorithm: ""

# Omit this whole block for Standalone. Its presence declares one member of a
# two- or three-node Primary/Replica group. Phase 0b validates the identity and
# mTLS boundary; a build without the replication runtime refuses to start with
# the block rather than silently serving as Standalone.
# replication:
  # @title.zh-CN 复制集群标识
  # @title.en-US Replication cluster ID
  # @description.zh-CN 同一复制组所有成员共享的稳定标识；长度 1–64，只允许字母、数字、点、下划线和连字符，且首字符必须是字母或数字。
  # @description.en-US Stable identity shared by every member; 1–64 characters using letters, digits, dot, underscore or hyphen, starting with a letter or digit.
  # cluster_id: "production-a"
  # @title.zh-CN 本节点标识
  # @title.en-US Local node ID
  # @description.zh-CN 本成员的稳定唯一标识；长度与字符规则同 cluster_id，且不得出现在 peers 中。
  # @description.en-US Stable unique identity of this member; the cluster_id length and character rules apply, and it must not appear in peers.
  # node_id: "halro-0"
  # @title.zh-CN 复制监听地址
  # @title.en-US Replication listen address
  # @description.zh-CN mTLS 复制端口的 host:port；端口必须在 1–65535 之间，并且不得与 Gateway、Admin 或 Metrics 监听地址相同。
  # @description.en-US host:port for the mTLS replication listener; the port must be between 1 and 65535 and the address must differ from the Gateway, Admin and Metrics listeners.
  # listen: "0.0.0.0:9910"
  # @title.zh-CN 复制成员
  # @title.en-US Replication peers
  # @description.zh-CN 只列其它成员：一个 peer 表示两节点并会产生可用性警告，两个 peer 表示三节点；不接受更多成员或在线变更成员。
  # @description.en-US Other members only: one peer forms a two-node group and emits an availability warning; two peers form a three-node group. Larger or online-changing membership is not accepted.
  # peers:
    # @title.zh-CN 成员名称
    # @title.en-US Peer name
    # @description.zh-CN 对端稳定 node_id；必须唯一，且不能等于本节点 node_id。
    # @description.en-US Stable node_id of the peer; it must be unique and must not equal this node's node_id.
    # - name: "halro-1"
      # @title.zh-CN 成员地址
      # @title.en-US Peer address
      # @description.zh-CN 可拨号的 host:port；端口范围为 1–65535，不能使用 0.0.0.0 或 :: 等未指定地址，且每个 peer 必须唯一。
      # @description.en-US Dialable host:port with a port from 1–65535; unspecified addresses such as 0.0.0.0 or :: are refused, and every peer address must be unique.
      # address: "halro-1.halro-internal:9910"
      # @title.zh-CN 成员公钥固定值
      # @title.en-US Peer public-key pin
      # @description.zh-CN 对端证书 SPKI 的 sha256: 加 64 位小写十六进制摘要；每个 peer 必须使用不同固定值。
      # @description.en-US Peer certificate SPKI as sha256: plus 64 lowercase hexadecimal characters; every peer must have a distinct pin.
      # spki_sha256: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    # - name: "halro-2"
      # address: "halro-2.halro-internal:9910"
      # spki_sha256: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
  # tls:
    # @title.zh-CN 集群 CA 文件
    # @title.en-US Cluster CA file
    # @description.zh-CN 用于验证成员证书的集群 CA；replication 没有明文模式，三个 TLS 文件缺一不可。
    # @description.en-US Cluster CA used to verify member certificates; replication has no plaintext mode and all three TLS files are required.
    # ca_file: "/run/secrets/halro-cluster/ca.crt"
    # @title.zh-CN 本节点证书
    # @title.en-US Local member certificate
    # @description.zh-CN 本节点的成员证书；cert_file 必须与 replication.tls.key_file 不同。
    # @description.en-US Certificate of this member; cert_file must differ from replication.tls.key_file.
    # cert_file: "/run/secrets/halro-cluster/tls.crt"
    # @title.zh-CN 本节点私钥
    # @title.en-US Local member private key
    # @description.zh-CN 与 cert_file 配套的私钥；文件内容不会由 config check 读取。
    # @description.en-US Private key paired with cert_file; config check does not read the file contents.
    # key_file: "/run/secrets/halro-cluster/tls.key"

admin:
  # @title.zh-CN 会话有效期
  # @title.en-US Session lifetime
  # @description.zh-CN 管理员会话可存续的最长时间。
  # @description.en-US Maximum lifetime of an administrator session.
  session_ttl: "8h"
  # @title.zh-CN 会话空闲超时
  # @title.en-US Session idle timeout
  # @description.zh-CN 无操作后管理员会话失效的时间。
  # @description.en-US Inactivity period after which an administrator session expires.
  idle_timeout: "30m"
  # @title.zh-CN 登录速率限制
  # @title.en-US Login rate limit
  # @description.zh-CN 每分钟允许的管理员登录尝试数。
  # @description.en-US Administrator login attempts allowed per minute.
  login_rpm: 5
  # @title.zh-CN 初始化令牌文件
  # @title.en-US Setup token file
  # @description.zh-CN 生产环境挂载的一次性初始化令牌绝对路径；已有管理员后不再读取。
  # @description.en-US Absolute path to a mounted one-time setup token; ignored after an administrator exists.
  setup_token_file: ""
  # @title.zh-CN 初始化令牌有效期
  # @title.en-US Setup token lifetime
  # @description.zh-CN 生成令牌的有效期或文件绝对过期时间在加载时允许的最大剩余时间，最大 24 小时；重启不续期。
  # @description.en-US Generated-token lifetime or maximum remaining lifetime accepted from a file's absolute expiry, capped at 24 hours; restart does not renew it.
  setup_token_ttl: "30m"
  # @title.zh-CN MFA 策略
  # @title.en-US MFA policy
  # @description.zh-CN 多因素认证策略：optional 不强制，administrators_required 仅强制 administrator 角色，required 强制所有控制台账户。
  # @description.en-US MFA policy: optional does not require enrollment, administrators_required requires the administrator role, and required covers every console account.
  mfa_policy: "optional"
  # "disabled" keeps the Admin listener free of data-plane traffic. Leave it
  # enabled for a loopback-only Admin listener; set "disabled" once that
  # listener is reachable from elsewhere, because network controls applied to
  # the Gateway listener do not cover this path. Startup warns when it matters.
  # @title.zh-CN 开发者工作台
  # @title.en-US Developer workbench
  # @description.zh-CN 控制 Admin 监听端上的真实 Gateway 调试入口。
  # @description.en-US Controls the real Gateway workbench on the Admin listener.
  developer_workbench: "enabled"
  # Deletes, Provider-credential replacement and edits that remove a protection
  # in force ask for the account password (plus a TOTP code where the account
  # has an authenticator), so a stolen session alone cannot do them. This is how
  # long one such proof keeps counting for the session that gave it.
  # @title.zh-CN 重新验证有效期
  # @title.en-US Re-authentication window
  # @description.zh-CN 删除、替换凭据或削弱防护的编辑需要重新验证身份；一次验证之后，同一个管理会话可以在多久之内继续执行这类操作而无需再次验证。绑定到该会话，不绑定到账户，也不覆盖管理员账户自身的操作（改密码、删除验证器、关闭二次验证）；设为 0s 则每次都要求验证。
  # @description.en-US Deletes, credential replacement and protection-weakening edits require re-authentication; this is how long one proof keeps letting the same admin session perform them. Bound to that session, never to the account, and never covering admin-account changes; 0s asks every time.
  reauth_elevation_window: 10m0s
  # @title.zh-CN 管理端外部地址
  # @title.en-US Admin external origin
  # @description.zh-CN 浏览器访问 Admin 时使用的规范外部源地址。
  # @description.en-US Canonical external origin used to access Admin in a browser.
  external_origin: ""
  # Capability checks run only after an administrator explicitly confirms a
  # model. They may make billable provider calls and never run on input/change.
  model_capability_detection:
    # @title.zh-CN 检测结果新鲜期
    # @title.en-US Detection freshness
    # @description.zh-CN 能力检测结果无需重新检测的有效时间。
    # @description.en-US Time a capability result remains fresh without retesting.
    fresh_ttl: "24h"
    # @title.zh-CN 检测记录保留期
    # @title.en-US Detection retention
    # @description.zh-CN 能力检测记录的保留时间。
    # @description.en-US Retention period for capability detection records.
    retention: "720h"
    # @title.zh-CN 刷新冷却时间
    # @title.en-US Refresh cooldown
    # @description.zh-CN 同一模型两次手动刷新之间的最短间隔。
    # @description.en-US Minimum interval between manual refreshes for one model.
    refresh_cooldown: "5m"
    # @title.zh-CN 检测总超时
    # @title.en-US Detection timeout
    # @description.zh-CN 一次能力检测任务允许的总执行时间。
    # @description.en-US Total execution time allowed for one capability detection.
    total_timeout: "90s"
    # @title.zh-CN 全局检测并发
    # @title.en-US Global detection concurrency
    # @description.zh-CN 实例同时运行的能力检测任务上限。
    # @description.en-US Maximum capability detections running across the instance.
    global_concurrency: 4
    # @title.zh-CN 服务商检测并发
    # @title.en-US Provider detection concurrency
    # @description.zh-CN 单个服务商同时运行的能力检测任务上限。
    # @description.en-US Maximum concurrent detections for one provider.
    provider_concurrency: 1
    # @title.zh-CN 最大服务商调用数
    # @title.en-US Maximum provider calls
    # @description.zh-CN 单次检测允许发起的计费服务商调用上限。
    # @description.en-US Maximum billable provider calls allowed per detection.
    max_provider_calls: 10
    # @title.zh-CN 每管理员创建速率
    # @title.en-US Creation rate per administrator
    # @description.zh-CN 每位管理员每分钟可启动的新检测任务上限；目录、缓存和幂等复用不计入。
    # @description.en-US Maximum new detection jobs per administrator per minute; catalog, cache, and idempotent reuse do not count.
    create_rpm: 6

usage:
  # @title.zh-CN 用量持久性
  # @title.en-US Usage durability
  # @description.zh-CN 用量写入在延迟与持久性之间采用的策略。
  # @description.en-US Durability policy balancing usage-write latency and persistence.
  durability: "balanced"
  # @title.zh-CN 记账时区
  # @title.en-US Accounting timezone
  # @description.zh-CN 仅在首次初始化时作为记账时区的初值。此后以实例设置为准，改这里不再生效；halro doctor 会报告两者不一致。
  # @description.en-US Seeds the accounting timezone at first initialisation only. The instance setting governs afterwards and this value no longer applies; halro doctor reports when the two disagree.
  timezone: "Asia/Shanghai"
  # @title.zh-CN WAL 队列容量
  # @title.en-US WAL queue capacity
  # @description.zh-CN 等待写入用量 WAL 的记录容量。
  # @description.en-US Record capacity of the pending usage WAL queue.
  wal_queue_capacity: 4096
  # @title.zh-CN WAL 最大批次
  # @title.en-US WAL maximum batch
  # @description.zh-CN 单次 WAL 持久化处理的最大记录数。
  # @description.en-US Maximum records persisted in one WAL batch.
  wal_max_batch: 128
  # @title.zh-CN WAL 刷新间隔
  # @title.en-US WAL flush interval
  # @description.zh-CN 未满批次等待持久化的最长时间。
  # @description.en-US Maximum time a partial WAL batch waits before persistence.
  wal_flush_interval: "2ms"
  # @title.zh-CN 分析队列容量
  # @title.en-US Analytics queue capacity
  # @description.zh-CN 等待分析处理的用量记录容量。
  # @description.en-US Capacity of usage records waiting for analytics processing.
  analytics_queue_capacity: 4096
  # @title.zh-CN 检查点间隔
  # @title.en-US Checkpoint interval
  # @description.zh-CN 用量状态生成持久化检查点的频率。
  # @description.en-US Frequency at which durable usage checkpoints are created.
  checkpoint_interval: "1m"
  # @title.zh-CN 分区写入间隔
  # @title.en-US Partition write interval
  # @description.zh-CN 聚合用量写入分析分区的频率。
  # @description.en-US Frequency at which aggregated usage is written to analytics partitions.
  parquet_interval: "1h"
  # @title.zh-CN 用量保留天数
  # @title.en-US Usage retention days
  # @description.zh-CN 归档保留天数，管的是磁盘上的 Parquet 分区，不是控制台能翻多久。
  # @description.zh-CN 至少 7 天：console_window_days 不得低于 7 天，也不得超过本项。
  # @description.en-US How long the Parquet archive on disk is kept. This is not how far the
  # @description.en-US console can page back. At least 7 days: console_window_days may go no
  # @description.en-US lower and may not exceed this.
  retention_days: 90
  # @title.zh-CN 控制台可见天数
  # @title.en-US Console window in days
  # @description.zh-CN 控制台「调用明细」与「最终失败」能往回翻多久。**本文件只在首次启动时作为初值**，此后由「设置 → 实例」中的运行时设置决定（有版本、有审计、缩短时需确认）。与 retention_days 分开设置：那个管磁盘上的归档，这个管内存里的聚合——后者每次 checkpoint 都会被整体重新序列化，所以它的长度同时是时间成本。至少 7 天（运行总览要读这么多天），且不超过 retention_days。
  # @description.en-US How far back the console's attempt log and failed-request list can page. **This file only seeds it on first start**; afterwards the runtime setting under Settings -> Instance decides, where the change is versioned, audited, and confirmed when it shortens the window. Separate from retention_days: that bounds the archive on disk, this bounds the in-memory aggregate the screens are served from, which is re-serialized whole on every checkpoint and so costs time as well as space. At least 7 days (the overview reads that many) and no more than retention_days.
  console_window_days: 30
  # parquet (default) or ndjson (ADR 0017, docs/adr/0017-usage-export-format.md).
  # @title.zh-CN 用量导出格式
  # @title.en-US Usage export format
  # @description.zh-CN 新用量分区采用的容器格式，不重写已有分区。
  # @description.en-US Container format for new usage partitions; existing partitions are not rewritten.
  export_format: "parquet"

ledger:
  seal:
    # @title.zh-CN 启用 WAL 封存
    # @title.en-US Enable WAL sealing
    # @description.zh-CN 开启后，活动 WAL 超过 max_active_bytes 就整代封存：改名归档、写入段清单、换一个空文件继续，新文件的第一帧接着上一代的哈希链。不删除任何东西——重放先读封存段再读活动文件，账务仍从完整历史重建。默认关闭：这是唯一会让账务权威的字节挪位置的机制，开启应当是一次针对具体磁盘的决定。
    # @description.en-US When on, the active WAL is sealed whole once it passes max_active_bytes: renamed aside, recorded in a segment manifest, replaced by an empty successor whose first frame continues the same hash chain. Nothing is deleted — replay reads the sealed generations and then the active file, so balances still rebuild from the whole history. Off by default: this is the only mechanism that moves the accounting authority's bytes, and enabling it should be a decision about a specific disk.
    enabled: false
    # @title.zh-CN 活动 WAL 封存阈值（字节）
    # @title.en-US Active WAL seal threshold in bytes
    # @description.zh-CN 活动代超过这个字节数就封存。按字节而非按天：耗尽的是磁盘，而一天的历史在每台机器上都是不同的字节数。最小 16 MiB。
    # @description.en-US Size the active generation may reach before it is rolled off. Bytes rather than days: what runs out is disk, and a day of history is a different number of bytes on every install. Minimum 16 MiB.
    max_active_bytes: 8589934592
    # @title.zh-CN 压缩封存段
    # @title.en-US Compress sealed generations
    # @description.zh-CN 在之后的维护周期把已封存的代替换成 gzip 副本，压缩前后的明文校验和与长度都会核对。只在该代已完全导出到归档并越过用量 checkpoint 之后进行。
    # @description.en-US Replaces a sealed generation with a gzip copy on a later maintenance tick, after reading it back and checking its plaintext length and checksum. Only done once the generation has fully reached the archive and the usage checkpoint.
    compress: true

gateway:
  # @title.zh-CN 路由总超时
  # @title.en-US Route total timeout
  # @description.zh-CN 一次 Gateway 请求跨所有尝试允许的总时间。
  # @description.en-US Total time allowed across all attempts for one Gateway request.
  route_total_timeout: 120s
  # @title.zh-CN 价格时钟回退容差
  # @title.en-US Pricing rollback tolerance
  # @description.zh-CN 价格选择时间允许向后偏移的安全容差。
  # @description.zh-CN 至少 1 秒，否则并发的价格选择会被误判成墙上时钟回退。
  # @description.en-US Safe tolerance for backward movement in pricing selection time.
  # @description.en-US At least 1s, so concurrent price selections cannot be mistaken for a
  # @description.en-US wall-clock rollback.
  pricing_clock_rollback_tolerance: 2s
  # @title.zh-CN 价格时钟前移容差
  # @title.en-US Pricing forward tolerance
  # @description.zh-CN 价格选择时间允许超前于当前时钟的容差。
  # @description.en-US Tolerance for pricing selection time being ahead of the current clock.
  pricing_clock_forward_tolerance: 30s
  # @title.zh-CN 未知价格策略
  # @title.en-US Unknown pricing policy
  # @description.zh-CN 无法确定有效价格时采用的失败策略。
  # @description.en-US Failure policy used when no valid price can be established.
  pricing_unknown_policy: reject
  # @title.zh-CN 连接尝试超时
  # @title.en-US Attempt connect timeout
  # @description.zh-CN 单次上游尝试建立连接允许的时间。
  # @description.en-US Time allowed to establish an upstream connection per attempt.
  attempt_connect_timeout: 5s
  # @title.zh-CN 响应头超时
  # @title.en-US Response header timeout
  # @description.zh-CN 单次上游尝试等待响应头的最长时间。
  # @description.en-US Maximum time an upstream attempt waits for response headers.
  attempt_response_header_timeout: 60s
  # @title.zh-CN 下游写入超时
  # @title.en-US Downstream write timeout
  # @description.zh-CN 向客户端写入单次响应数据允许的时间。
  # @description.en-US Time allowed for an individual response write to the client.
  downstream_write_timeout: 15s
  # @title.zh-CN 流最长持续时间
  # @title.en-US Maximum stream duration
  # @description.zh-CN 单个流式请求允许保持活动的最长时间。
  # @description.en-US Maximum lifetime allowed for one streaming request.
  stream_max_duration: 10m
  # @title.zh-CN 最大总尝试次数
  # @title.en-US Maximum total attempts
  # @description.zh-CN 一次请求跨路由目标允许的尝试总数。能触及的候选数是
  # @description.zh-CN ceil(max_total_attempts / retry.max_attempts_per_target)，
  # @description.zh-CN 小于最长回退链时，最后一个目标配了也永远不会被调用。
  # @description.en-US Total attempts allowed across route targets for one request. The number of
  # @description.en-US candidates a request can reach is
  # @description.en-US ceil(max_total_attempts / retry.max_attempts_per_target); set it below the
  # @description.en-US longest fallback chain and the last target is configured and never called.
  max_total_attempts: 4
  # @title.zh-CN 延迟取回工作线程数
  # @title.en-US Deferred response workers
  # @description.zh-CN 同时执行延迟提交的工作线程数,整个实例共用。队列上限是按项目的,
  # @description.zh-CN 消费能力是全局的:调高它会增加延迟层能同时压在上游的并发量,每个
  # @description.zh-CN 线程最长占用一次 route_total_timeout。出队顺序按项目轮转,所以
  # @description.zh-CN 一个项目灌满自己的队列不会挡住其他项目。
  # @description.zh-CN 取值 1 到 256。
  # @description.en-US How many deferred submissions execute at once, shared by the whole
  # @description.en-US instance. The queue ceiling is per Project and this is global: raising it
  # @description.en-US raises how much concurrent upstream work the deferred tier may add, each
  # @description.en-US worker holding one call for up to route_total_timeout. Dequeuing takes one
  # @description.en-US submission from each Project in turn, so a Project that fills its own queue
  # @description.en-US does not hold up the others.
  # @description.en-US Between 1 and 256.
  deferred_response_workers: 4
  # @title.zh-CN 健康探测间隔
  # @title.en-US Health probe interval
  # @description.zh-CN 后台探测部署健康状态的时间间隔。
  # @description.en-US Interval between background deployment health probes.
  health_probe_interval: 30s
  # Per-source admission, applied before authentication. Set requests_per_minute
  # to 0 to disable; addresses beyond max_tracked_sources share a single budget
  # so the limiter itself stays bounded.
  source_rate_limit:
    # @title.zh-CN 来源每分钟请求数
    # @title.en-US Source requests per minute
    # @description.zh-CN 身份认证前单个来源地址的每分钟请求预算，0 表示禁用。
    # @description.en-US Pre-authentication request budget per source address; zero disables it.
    requests_per_minute: 600
    # @title.zh-CN 最大来源跟踪数
    # @title.en-US Maximum tracked sources
    # @description.zh-CN 独立跟踪限流状态的来源地址数量上限。
    # @description.en-US Maximum source addresses tracked with independent rate-limit state.
    max_tracked_sources: 16384
  failure_capture:
    # @title.zh-CN 保存失败请求的原始载荷
    # @title.en-US Capture failed request payloads
    # @description.zh-CN 保存 Gateway 收到的失败请求正文、Halro 脱敏后的规范化请求，以及上游返回或传输错误，便于核对业务字段经过了什么转换；成功调用不保存，请求头和 Gateway 凭据永不保存。开启会改变本数据目录的数据分级：记录用主密钥加密、绑定到所属请求与项目、各部分按 max_bytes 截断、按 max_records_per_day 封顶、到 retain 后删除，且只能通过写审计的管理员操作读取。Gateway 请求位于脱敏之前，可能包含脱敏策略随后移除的调用方内容。
    # @description.en-US Keeps the failed request body received by the Gateway, Halro's normalized post-redaction request, and the provider response or transport error so an operator can see how caller-facing fields were translated; successful calls, request headers, and Gateway credentials are never stored. Enabling it changes the data classification of this directory: records are encrypted under the master key, bound to their request and project, each part is truncated at max_bytes, capture is capped at max_records_per_day, records are deleted after retain, and reads require an audited admin action. The Gateway request precedes redaction and may contain caller material that the policy subsequently removes.
    enabled: false
    # @title.zh-CN 单条载荷上限（字节）
    # @title.en-US Payload size ceiling (bytes)
    # @description.zh-CN Gateway 请求、规范化请求与响应分别截断到该长度（允许范围 1024–1048576）；被截断的一侧会在记录里标注。
    # @description.en-US The Gateway request, normalized request, and response are truncated to this length separately (allowed range 1024 to 1048576); a truncated part is flagged in the record.
    max_bytes: 65536
    # @title.zh-CN 每日保存条数上限
    # @title.en-US Daily record ceiling
    # @description.zh-CN 上游大面积失败时的封顶（允许范围 1–1000000）；超过后当日停止保存并记录一次。
    # @description.en-US The ceiling for a day in which an upstream is failing everything (allowed range 1 to 1000000); past it capture stops for the day and says so once.
    max_records_per_day: 1000
    # @title.zh-CN 保留时长
    # @title.en-US Retention window
    # @description.zh-CN 单条载荷保留多久后自动删除，逐条按写入时刻判定。这是「调用方内容保存多久」的答案，由清理任务强制执行；即使 enabled 改回 false，已保存的记录仍会被继续清理。允许范围 1h–720h。
    # @description.en-US How long a single capture lives before it is deleted, decided per record from when it was written. This is the answer to "how long is caller content kept", enforced by a sweep rather than promised — and the sweep keeps running after enabled is set back to false, so turning capture off does not strand what it collected. Allowed range is 1h to 720h.
    retain: 24h

retry:
  # @title.zh-CN 单目标最大尝试次数
  # @title.en-US Maximum attempts per target
  # @description.zh-CN 对同一上游目标允许的最大尝试次数。默认 1：再问同一家只对瞬时抖动有用，
  # @description.zh-CN 却花掉了下一家本可以用的名额。只配了单个目标的 alias 可以调高。
  # @description.en-US Maximum attempts allowed against one upstream target. One by default: asking
  # @description.en-US the same upstream again helps only a transient blip and spends an attempt the
  # @description.en-US next provider could have had. Raise it for an alias with a single target.
  max_attempts_per_target: 1
  # @title.zh-CN 重试基础延迟
  # @title.en-US Retry base delay
  # @description.zh-CN 计算退避时间使用的初始延迟。
  # @description.en-US Initial delay used to calculate retry backoff.
  base_delay: 100ms
  # @title.zh-CN 重试最大延迟
  # @title.en-US Retry maximum delay
  # @description.zh-CN 单次重试退避允许达到的最大时间。
  # @description.en-US Maximum delay allowed for one retry backoff.
  max_delay: 2s
  # @title.zh-CN 重试随机抖动
  # @title.en-US Retry jitter
  # @description.zh-CN 是否为重试退避加入随机抖动。
  # @description.en-US Adds randomized jitter to retry backoff.
  jitter: true

routing:
  # @title.zh-CN 可用性失败阈值
  # @title.en-US Availability failure threshold
  # @description.zh-CN 连续多少次“没有明确理由”的失败后，把一个目标移出候选。大于 1，因为单次 5xx 是噪声。
  # @description.en-US Consecutive failures with no stated reason before a target is taken out of service. More than one, because a single 5xx is noise.
  availability_failures: 5
  # @title.zh-CN 首次挂起时长
  # @title.en-US Initial suspension
  # @description.zh-CN 第一次挂起的时长；每当探测发现上游仍在失败，就翻倍，直到上限。
  # @description.en-US The first suspension, doubling each time a probe finds the upstream still failing, up to the maximum.
  suspend_for: 30s
  # @title.zh-CN 挂起时长上限
  # @title.en-US Maximum suspension
  # @description.zh-CN 挂起时长翻倍的上限。
  # @description.en-US Ceiling the suspension window doubles towards.
  max_suspend_for: 5m0s
  # @title.zh-CN 探测请求数
  # @title.en-US Probe requests
  # @description.zh-CN 挂起窗口结束后，允许多少个请求去试探这个目标。
  # @description.en-US How many requests may test a suspended target once its window is up.
  probe_requests: 1

alerts:
  # @title.zh-CN 告警队列容量
  # @title.en-US Alert queue capacity
  # @description.zh-CN 等待分发的告警事件容量。
  # @description.en-US Capacity of alert events waiting for dispatch.
  queue_capacity: 1024
  # @title.zh-CN 告警工作线程
  # @title.en-US Alert workers
  # @description.zh-CN 并行投递告警的工作线程数。
  # @description.en-US Workers delivering alerts concurrently.
  workers: 2
  # @title.zh-CN 告警投递超时
  # @title.en-US Alert delivery timeout
  # @description.zh-CN 单次告警投递允许的最长时间。
  # @description.en-US Maximum time allowed for one alert delivery.
  timeout: 5s
  # @title.zh-CN 告警最大尝试次数
  # @title.en-US Alert maximum attempts
  # @description.zh-CN 单条告警投递允许的最大尝试次数。
  # @description.en-US Maximum delivery attempts allowed for one alert.
  max_attempts: 3
  # @title.zh-CN 告警重试基础延迟
  # @title.en-US Alert retry base delay
  # @description.zh-CN 告警投递重试的初始退避时间。
  # @description.en-US Initial backoff delay for alert delivery retries.
  base_delay: 250ms
  # @title.zh-CN 告警重试最大延迟
  # @title.en-US Alert retry maximum delay
  # @description.zh-CN 告警投递重试的最大退避时间。
  # @description.en-US Maximum backoff delay for alert delivery retries.
  max_delay: 5s
  # @title.zh-CN 告警去重冷却时间
  # @title.en-US Alert deduplication cooldown
  # @description.zh-CN 相同告警再次允许投递前的冷却时间。
  # @description.en-US Cooldown before an identical alert may be delivered again.
  dedup_cooldown: 1m

security:
  # @title.zh-CN 服务商私网访问
  # @title.en-US Private provider access
  # @description.zh-CN 是否允许服务商端点解析或连接私有网络地址。
  # @description.en-US Allows provider endpoints to resolve or connect to private network addresses.
  allow_private_provider_endpoints: false
  # @title.zh-CN Webhook 私网访问
  # @title.en-US Private webhook access
  # @description.zh-CN 是否允许 Webhook 目标解析或连接私有网络地址。
  # @description.en-US Allows webhook targets to resolve or connect to private network addresses.
  allow_private_webhooks: false
  # @title.zh-CN 信任代理请求头
  # @title.en-US Trust proxy headers
  # @description.zh-CN 是否从可信代理发送的转发头读取客户端地址。
  # @description.en-US Reads client addresses from forwarding headers sent by trusted proxies.
  trust_proxy_headers: false
  # @title.zh-CN 可信代理网段
  # @title.en-US Trusted proxy CIDRs
  # @description.zh-CN 允许提供可信转发头的代理 CIDR 列表。
  # @description.zh-CN trust_proxy_headers 打开时必填。
  # @description.en-US Proxy CIDRs allowed to supply trusted forwarding headers.
  # @description.en-US Required when trust_proxy_headers is on.
  trusted_proxy_cidrs: []

metrics:
  # @title.zh-CN 指标服务
  # @title.en-US Metrics service
  # @description.zh-CN 是否开放 Prometheus 指标服务。
  # @description.en-US Enables the Prometheus metrics service.
  enabled: true
  # @title.zh-CN 指标认证
  # @title.en-US Metrics authentication
  # @description.zh-CN 是否要求指标抓取请求提供凭据。
  # @description.en-US Requires credentials on metrics scrape requests.
  require_auth: true
  # @title.zh-CN 指标凭据文件
  # @title.en-US Metrics credential file
  # @description.zh-CN 指标服务独立认证凭据的文件路径。
  # @description.zh-CN 需要同时打开 metrics.require_auth。
  # @description.en-US Path to the metrics service's independent credential file.
  # @description.en-US Requires metrics.require_auth.
  credential_file: ""
  # @title.zh-CN 最大并发抓取数
  # @title.en-US Maximum concurrent scrapes
  # @description.zh-CN 指标服务同时处理的抓取请求上限。
  # @description.zh-CN 取值 1 到 32。
  # @description.en-US Maximum metrics scrape requests handled concurrently.
  # @description.en-US Between 1 and 32.
  max_concurrent_scrapes: 2
  # @title.zh-CN 指标写入超时
  # @title.en-US Metrics write timeout
  # @description.zh-CN 指标响应写回抓取客户端允许的最长时间。
  # @description.zh-CN 大于零且不超过 30 秒。
  # @description.en-US Maximum time allowed to write a metrics response.
  # @description.en-US Above zero and at most 30 seconds.
  write_timeout: 5s
  tls:
    # @title.zh-CN 指标 TLS
    # @title.en-US Metrics TLS
    # @description.zh-CN 是否为指标服务启用独立 TLS。
    # @description.en-US Enables independent TLS for the metrics service.
    enabled: false
    # @title.zh-CN 指标 TLS 证书
    # @title.en-US Metrics TLS certificate
    # @description.zh-CN 指标服务 TLS 证书链文件路径。
    # @description.en-US Path to the metrics TLS certificate chain.
    cert_file: ""
    # @title.zh-CN 指标 TLS 私钥
    # @title.en-US Metrics TLS private key
    # @description.zh-CN 指标服务 TLS 私钥文件路径。
    # @description.en-US Path to the metrics TLS private key.
    key_file: ""
    # @title.zh-CN 指标客户端 CA
    # @title.en-US Metrics client CA
    # @description.zh-CN 验证指标抓取客户端证书使用的 CA 文件。
    # @description.en-US CA file used to verify metrics scrape client certificates.
    client_ca_file: ""

audit:
  anchor:
    # Off by default (ADR 0015, docs/adr/0015-audit-chain-external-anchoring.md).
    # In mode: file, master.key holder can rewrite audit history undetected by
    # anyone else. Enabling this periodically publishes a payload-free summary
    # of the audit chain (record count + hash, no event content) that a
    # dead-man probe on a separate host pulls and keeps — a later rewrite then
    # disagrees with a copy the operator does not control.
    # @title.zh-CN 外部审计锚定
    # @title.en-US External audit anchoring
    # @description.zh-CN 是否发布审计链摘要供独立 dead-man 主机留存。
    # @description.en-US Publishes audit-chain summaries for retention by an independent dead-man host.
    enabled: false
    # dead_man_pull is the only implemented sink; it reuses the existing
    # halro-deadman probe and its independent host/credentials/TLS.
    # @title.zh-CN 审计锚定接收端
    # @title.en-US Audit anchor sink
    # @description.zh-CN 接收外部审计锚定摘要的实现类型。
    # @description.zh-CN dead_man_pull 要求 metrics.enabled 与 metrics.tls.enabled 同时打开；
    # @description.zh-CN 锚定源不能以明文提供。
    # @description.en-US Sink implementation receiving external audit-anchor summaries.
    # @description.en-US dead_man_pull requires both metrics.enabled and metrics.tls.enabled;
    # @description.en-US the anchor feed must not be served in the clear.
    sink: dead_man_pull
    # @title.zh-CN 审计锚定间隔
    # @title.en-US Audit anchor interval
    # @description.zh-CN 即使记录增量未达到阈值也发布锚定的最长间隔。
    # @description.zh-CN 大于零且不超过 1 小时。
    # @description.en-US Maximum interval between anchors even below the record threshold.
    # @description.en-US Above zero and at most one hour.
    interval: 5m
    # @title.zh-CN 审计锚定记录增量
    # @title.en-US Audit anchor record delta
    # @description.zh-CN 触发发布新锚定所需的新增审计记录数。
    # @description.en-US New audit records required to publish another anchor.
    record_delta: 500
    # Required once enabled. Independent from metrics.credential_file — the
    # two rotate on unrelated schedules and one must not authorize the other.
    # @title.zh-CN 审计锚定凭据文件
    # @title.en-US Audit anchor credential file
    # @description.zh-CN dead-man 拉取审计锚定使用的独立凭据文件。
    # @description.zh-CN 必须与 metrics.credential_file 不同。
    # @description.en-US Independent credential file used by dead-man audit-anchor pulls.
    # @description.en-US It must differ from metrics.credential_file.
    credential_file: ""

model_catalog:
  # @title.zh-CN 签名模型目录更新
  # @title.en-US Signed model catalog updates
  # @description.zh-CN 默认关闭；启用后仅后台通过固定端点和编译期信任根刷新，Gateway 请求路径不会下载目录。
  # @description.en-US Disabled by default; background refresh uses a compiled endpoint and trust roots, never the Gateway request path.
  enabled: false
  # @title.zh-CN 目录刷新间隔
  # @title.en-US Catalog refresh interval
  # @description.zh-CN 后台检查签名目录更新的间隔。
  # @description.zh-CN 取值 5 分钟到 7 天。
  # @description.en-US Interval between signed catalog update checks.
  # @description.en-US Between 5 minutes and 7 days.
  refresh_interval: 6h
  # @title.zh-CN 固定目录 revision
  # @title.en-US Pinned catalog revision
  # @description.zh-CN 可选 sha256 revision；非精确匹配的更新会被拒绝。
  # @description.en-US Optional sha256 revision; non-exact updates are rejected.
  pinned_revision: ""
  # @title.zh-CN 最大下载字节数
  # @title.en-US Maximum download bytes
  # @description.zh-CN 压缩响应体的硬上限。
  # @description.zh-CN 取值 4096 到 16777216。
  # @description.en-US Hard limit for the compressed response body.
  # @description.en-US Between 4096 and 16777216.
  max_download_bytes: 1048576
  # @title.zh-CN 最大解码字节数
  # @title.en-US Maximum decoded bytes
  # @description.zh-CN 解压和解码后的硬上限。
  # @description.zh-CN 不小于 max_download_bytes，且不超过 67108864。
  # @description.en-US Hard limit after decompression and decoding.
  # @description.en-US At least max_download_bytes and at most 67108864.
  max_decoded_bytes: 4194304
  # @title.zh-CN 最大压缩比
  # @title.en-US Maximum compression ratio
  # @description.zh-CN 拒绝超过该展开比例的压缩目录。
  # @description.zh-CN 取值 1 到 100。
  # @description.en-US Rejects compressed catalogs exceeding this expansion ratio.
  # @description.en-US Between 1 and 100.
  max_compression_ratio: 20
  # @title.zh-CN 最大目录条目数
  # @title.en-US Maximum catalog entries
  # @description.zh-CN 单个已验证清单允许的最大精确模型条目数。
  # @description.zh-CN 取值 1 到 100000。
  # @description.en-US Maximum exact model entries in one verified manifest.
  # @description.en-US Between 1 and 100000.
  max_entries: 10000

# Consumer subscription products, off in the shipped default.
#
# Both upstreams reserve these credentials for their own clients: Anthropic's
# Claude Code legal and compliance page does not permit a developer to collect,
# store or intermediate a Claude.ai credential, nor to route requests through
# Free, Pro or Max credentials on behalf of users. Halro holding one and
# presenting it upstream is what that describes, and neither upstream enforces it
# on the paths Halro would use — both were measured, see docs/verification/ — so
# nothing but this switch stops it.
#
# Leave it false for any instance that serves anyone but you. The supported
# answer is a metered API key, which is a different product with its own billing.
# This exists for developing and debugging against your own account.
provider_subscriptions:
  # @title.zh-CN Claude 订阅接入
  # @title.en-US Claude subscription access
  # @description.zh-CN 是否提供 Claude 订阅产品。默认关闭：上游条款不允许第三方服务保存或代为出示该凭据，开启即自行承担。
  # @description.en-US Whether the Claude subscription product is offered. Off by default: the upstream's terms do not permit a third-party service to hold or present that credential.
  anthropic_claude: false

logging:
  # @title.zh-CN 日志级别
  # @title.en-US Log level
  # @description.zh-CN debug、info、warn 或 error；低于该级别的记录不写出。
  # @description.en-US debug, info, warn or error; records below this level are not written.
  level: info
  # @title.zh-CN 日志格式
  # @title.en-US Log format
  # @description.zh-CN json 供机器读取，text 供终端阅读。无论哪种格式，记录都已脱敏。
  # @description.en-US json for machine reading, text for a terminal. Records are redacted either way.
  format: json
  # @title.zh-CN 日志输出位置
  # @title.en-US Log output
  # @description.zh-CN stderr、file 或 both；没有外部采集器时用 file 或 both 在本机留一份。
  # @description.en-US stderr, file or both; use file or both to keep a local copy when nothing collects stderr.
  output: stderr
  # @title.zh-CN 日志文件路径
  # @title.en-US Log file path
  # @description.zh-CN 留空表示数据目录下的 logs/halro.log；仅在输出包含文件时使用。
  # @description.en-US Empty means logs/halro.log inside the data directory; used only when the output includes a file.
  file: ""
  # @title.zh-CN 单个日志文件上限（MB）
  # @title.en-US Log file size limit (MB)
  # @description.zh-CN 写入将超过该大小时轮转当前文件。
  # @description.zh-CN 取值 1 到 4096。
  # @description.en-US Rotates the current file once a record would carry it past this size.
  # @description.en-US Between 1 and 4096.
  max_size_mb: 64
  # @title.zh-CN 保留的日志文件数
  # @title.en-US Retained log files
  # @description.zh-CN 含正在写入的文件在内的总代数；1 表示不保留历史。
  # @description.zh-CN 取值 1 到 100。
  # @description.en-US Total generations kept, including the file being written; 1 keeps no history.
  # @description.en-US Between 1 and 100.
  max_files: 5
  error_file:
    # @title.zh-CN 启用错误专用日志文件
    # @title.en-US Enable the errors-only log file
    # @description.zh-CN 在普通日志之外另写一份只含 ERROR 的文件。把 level 设为 error 也能得到只含错误的日志，代价是丢掉证书临期、探针失败、回退前的尝试失败这些值得保留的 WARN；这个选项两者都留。它记录的条数少于控制台报告的最终失败数：预算、熔断、并发、Token Guard、能力不支持与脱敏拒绝属于策略生效，不写入这里。
    # @description.en-US Writes a second copy of the log holding ERROR records alone, beside the ordinary log. Setting level to error would get the same file by discarding the WARNs worth keeping — an expiring certificate, a failed probe, an attempt retried before its request succeeded. It holds fewer records than the console reports as failed requests: budget, breaker, concurrency, Token Guard, capability and redaction refusals are policy working, and are not written here.
    enabled: false
    # @title.zh-CN 错误日志文件路径
    # @title.en-US Error log file path
    # @description.zh-CN 留空表示数据目录下的 logs/halro-error.log。不得与 logging.file 指向同一路径。
    # @description.en-US Empty means logs/halro-error.log inside the data directory. It must not name the same path as logging.file.
    file: ""
    # @title.zh-CN 单个错误日志文件上限（MB）
    # @title.en-US Error log file size limit (MB)
    # @description.zh-CN 写入将超过该大小时轮转当前文件。
    # @description.zh-CN 取值 1 到 4096。
    # @description.en-US Rotates the current file once a record would carry it past this size.
    # @description.en-US Between 1 and 4096.
    max_size_mb: 32
    # @title.zh-CN 保留的错误日志文件数
    # @title.en-US Retained error log files
    # @description.zh-CN 含正在写入的文件在内的总代数；这些代数就是事故后可以往回读的范围。
    # @description.zh-CN 取值 1 到 100。
    # @description.en-US Total generations kept, including the file being written; these generations are how far back an operator can read after an incident.
    # @description.en-US Between 1 and 100.
    max_files: 10

# @title.zh-CN 物理压力准入
# @title.en-US Physical resource pressure admission
# @description.zh-CN 可选的 Linux cgroup v2/runtime/statfs 门禁，默认不启用。
# @description.zh-CN 全部数值须按目标 profile 校准；下面 0 为无效占位，不是默认或建议值。
# @description.zh-CN 尚不替代共享逻辑预算/持久化储备；动态 inode 文件系统可能保持未知。
# @description.en-US Optional Linux cgroup v2/runtime/statfs gate, disabled by default.
# @description.en-US Calibrate every value for the target profile; zeros below are invalid placeholders, not defaults or recommendations.
# @description.en-US Does not replace logical budgets or durable completion reserves; dynamic-inode filesystems may remain unknown.
# resource_pressure:
#   # @title.zh-CN Go 内存进入线
#   # @title.en-US Go memory enter threshold
#   # @description.zh-CN 达到此值关闭新工作准入。Go total−released 字节，非 RSS。
#   # @description.en-US Closes new-work admission at this Go total-minus-released byte value; not RSS.
#   runtime_enter_bytes: 0
#   # @title.zh-CN Go 内存退出线
#   # @title.en-US Go memory exit threshold
#   # @description.zh-CN 必须小于进入线；恢复须持续低于退出线。
#   # @description.en-US Must be below enter; recovery requires continuously low measurements.
#   runtime_exit_bytes: 0
#   # @title.zh-CN cgroup 进入线
#   # @title.en-US cgroup enter threshold
#   # @description.zh-CN 可见 leaf memory.current 的进入线，单位字节。
#   # @description.en-US Enter threshold in bytes for the visible leaf memory.current.
#   cgroup_enter_bytes: 0
#   # @title.zh-CN cgroup 退出线
#   # @title.en-US cgroup exit threshold
#   # @description.zh-CN 必须小于 cgroup 进入线。
#   # @description.en-US Must be below the cgroup enter threshold.
#   cgroup_exit_bytes: 0
#   # @title.zh-CN cgroup 余量进入线
#   # @title.en-US cgroup headroom enter threshold
#   # @description.zh-CN 任一可见层级有限 high/max 的剩余字节达到此线时关闭准入。
#   # @description.en-US Closes admission when any visible finite high/max headroom reaches this byte threshold.
#   headroom_enter_bytes: 0
#   # @title.zh-CN cgroup 余量退出线
#   # @title.en-US cgroup headroom exit threshold
#   # @description.zh-CN 必须大于余量进入线；隐藏祖先仍不可验证。
#   # @description.en-US Must exceed headroom enter; namespace-hidden ancestors remain unverifiable.
#   headroom_exit_bytes: 0
#   # @title.zh-CN 磁盘停止新工作线
#   # @title.en-US Disk new-work stop threshold
#   # @description.zh-CN storage.data_dir 的可用字节停止线，须覆盖最坏在途终结成本。
#   # @description.en-US Available data-directory byte stop threshold; must cover worst-case in-flight completion costs.
#   disk_enter_bytes: 0
#   # @title.zh-CN 磁盘退出线
#   # @title.en-US Disk exit threshold
#   # @description.zh-CN 必须大于磁盘进入线；不构成文件系统空间预分配。
#   # @description.en-US Must exceed disk enter; this does not preallocate filesystem space.
#   disk_exit_bytes: 0
#   # @title.zh-CN inode 停止线
#   # @title.en-US Inode stop threshold
#   # @description.zh-CN 已知可用 inode 停止线；无容量统计的文件系统保持未知。
#   # @description.en-US Known available inode stop threshold; filesystems without capacity statistics remain unknown.
#   inodes_enter: 0
#   # @title.zh-CN inode 退出线
#   # @title.en-US Inode exit threshold
#   # @description.zh-CN 必须大于 inode 进入线。
#   # @description.en-US Must exceed inode enter.
#   inodes_exit: 0
#   # @title.zh-CN 采样有效期
#   # @title.en-US Maximum sample age
#   # @description.zh-CN 从采集开始计算；迟到或停止采样不会续期。
#   # @description.en-US Measured from collection start; delayed or stopped sampling cannot renew evidence.
#   max_age: 0s
#   # @title.zh-CN 恢复冷却期
#   # @title.en-US Recovery cooldown
#   # @description.zh-CN 全部信号持续达到退出线的最短时间。
#   # @description.en-US Minimum continuous time all signals must meet their exit thresholds.
#   cooldown: 0s
#   # @title.zh-CN 采样间隔
#   # @title.en-US Sampling interval
#   # @description.zh-CN 必须为正并小于 max_age；不为每个采样创建 goroutine。
#   # @description.en-US Must be positive and below max_age; no per-sample goroutine.
#   sample_interval: 0s

# @title.zh-CN 共享逻辑 RAM 预算
# @title.en-US Shared logical RAM budget
# @description.zh-CN 可选，默认不启用；必须同时校准 resource_pressure。RAM/磁盘预算数值均须校准；下面 0 为无效占位，不能照抄启用。
# @description.zh-CN RAM 已接部分 HTTP/deferred/capture、HA 临时工作及 Source/Governance/价格 owner；逻辑磁盘上限可覆盖已取得共享预算的持久 owner。未接线的 owner 不会自动计费。
# @description.en-US Optional and disabled by default; requires calibrated resource_pressure. RAM and disk envelopes require calibration; zeros below are invalid placeholders.
# @description.en-US RAM covers selected HTTP/deferred/capture, HA temporaries and Source/Governance/pricing owners. Logical disk limits apply to persistent owners that acquire shared permits; unwired owners are not charged automatically.
# @description.zh-CN 显式启用未确认预算时，已接入 Primary Ledger、Audit、Governance、Metadata 及 provider object 的写前准入与持久确认后释放；完整故障与容量验收仍未完成。
# @description.en-US When enabled, pre-append admission and release after durable confirmation cover Primary Ledger, Audit, Governance, Metadata and provider-object sources; complete fault and capacity acceptance remain open.
# resource_budget:
#   # Require a migrated, authenticated seven-root Runtime. Startup refuses
#   # an absent/invalid selection before opening the legacy projection DBs.
#   # Cold reducers use fixed COW/scratch workspaces; Disk ceilings remain
#   # independently charged. This flag does not establish capacity acceptance.
#   memory_state_required: false
#   # @description.zh-CN 写入前预留认证终结物理块；要求合格的持久 ext4 和完整 owner 向量。当前 HA 启动在完整向量取得验证前拒绝此模式。
#   # @description.en-US Reserve authenticated physical terminal banks before writes. Requires qualified persistent ext4 storage and a complete owner vector. HA startup currently refuses this profile pending vector qualification.
#   physical_terminal_reserve: false
#   # @title.zh-CN 共享 RAM 总额
#   # @title.en-US Shared RAM capacity
#   # @description.zh-CN 含逻辑费用和 claim 元数据；不是 heap/RSS 硬限制。
#   # @description.en-US Includes logical costs and claim metadata; not a heap or RSS hard limit.
#   total_ram_bytes: 0
#   # @title.zh-CN 共享逻辑磁盘总额
#   # @title.en-US Shared logical disk capacity
#   # @description.zh-CN 已收费持久 owner 的共享逻辑字节上限；不预分配文件系统空间。
#   # @description.en-US Shared logical byte ceiling for charged persistent owners; does not preallocate filesystem blocks.
#   total_disk_bytes: 0
#   # @title.zh-CN 未确认总字节上限
#   # @title.en-US Total unconfirmed-byte capacity
#   # @description.zh-CN 可选；启用时还需单独配置 IO 与启动 Recovery 子额度。当前 Primary 的五类原生来源在 append 前接入。
#   # @description.en-US Optional; configure separate IO and startup Recovery ceilings. The five native Primary sources currently reserve before append.
#   total_unconfirmed_bytes: 0
#   # @title.zh-CN 未确认前缀条目上限
#   # @title.en-US Maximum unconfirmed prefix entries
#   # @description.zh-CN 新 append 的条目上限。启动可在固定 65536 项表内恢复更长旧后缀；超限时持续有界追赶并拒绝新写入，直到后缀回到配置范围。
#   # @description.en-US New-append entry limit. Startup can recover older suffixes within the fixed 65536-entry table; over-limit recovery keeps bounded catch-up running and rejects new writes until within configured limits.
#   unconfirmed_max_entries: 0
#   # @title.zh-CN 配置类别磁盘
#   # @title.en-US Configuration disk capacity
#   configuration_disk_bytes: 0
#   # @title.zh-CN 请求类别磁盘
#   # @title.en-US Active request disk capacity
#   active_disk_bytes: 0
#   # @title.zh-CN 缓存类别磁盘
#   # @title.en-US Cache disk capacity
#   cache_disk_bytes: 0
#   # @title.zh-CN IO 类别磁盘
#   # @title.en-US IO disk capacity
#   io_disk_bytes: 0
#   # @title.zh-CN IO 未确认字节
#   # @title.en-US IO unconfirmed bytes
#   io_unconfirmed_bytes: 0
#   # @title.zh-CN 后台类别磁盘
#   # @title.en-US Background disk capacity
#   background_disk_bytes: 0
#   # @title.zh-CN 终结类别磁盘额度
#   # @title.en-US Completion disk ceiling
#   # @description.zh-CN HTTP 新工作和 deferred worker 会原子预留此磁盘信用，分别保持到 handler 或后台终结写入退出；逻辑额度，不代表物理块预留或按终结记录核销。
#   # @description.en-US HTTP new work and deferred workers atomically reserve this disk credit through handler return or background terminal write; logical capacity, not physical blocks or per-settlement record reconciliation.
#   completion_disk_bytes: 0
#   completion_unconfirmed_bytes: 0 # HA terminal credits; cover (max_total_attempts + 1) isolated Ledger wire frames.
#   # @title.zh-CN 恢复类别磁盘
#   # @title.en-US Recovery disk capacity
#   recovery_disk_bytes: 0
#   # @title.zh-CN 启动恢复未确认字节
#   # @title.en-US Startup Recovery unconfirmed bytes
#   recovery_unconfirmed_bytes: 0
#   # @title.zh-CN 恢复专用磁盘储备
#   # @title.en-US Recovery-only disk reserve
#   # @description.zh-CN 普通工作不能借用；只能覆盖进入 Recovery 类别的已收费工作。
#   # @description.en-US Normal work cannot borrow this; only charged Recovery work can use it.
#   recovery_reserve_disk_bytes: 0
#   # @title.zh-CN 未确认字节恢复储备
#   # @title.en-US Unconfirmed-byte Recovery reserve
#   recovery_reserve_unconfirmed_bytes: 0
#   # @title.zh-CN 配置类别 RAM
#   # @title.en-US Configuration RAM
#   # @description.zh-CN 类别上限可重叠，共享总额不可超限；未接入的消费者不会自动收费。
#   # @description.en-US Class ceilings may overlap; the shared total cannot be exceeded. Unwired consumers are not automatically charged.
#   configuration_ram_bytes: 0
#   # @title.zh-CN 请求类别 RAM
#   # @title.en-US Active request RAM
#   # @description.zh-CN HTTP 新工作使用此类别，直到 handler 完全返回。
#   # @description.en-US New HTTP work uses this class until its handler fully returns.
#   active_ram_bytes: 0
#   # @title.zh-CN 缓存类别 RAM
#   # @title.en-US Cache RAM
#   # @description.zh-CN 预留类别；缓存实际费用尚未接入。
#   # @description.en-US Reserved class; actual cache consumers are not yet wired.
#   cache_ram_bytes: 0
#   # @title.zh-CN IO 类别 RAM
#   # @title.en-US IO RAM
#   # @description.zh-CN 价格选择/Prepare/冷审计先取得独立工作集；其它持久 IO 费用仍待接入。
#   # @description.en-US Pricing selection, Prepare and cold audit acquire an independent envelope; other durable IO consumers remain unwired.
#   io_ram_bytes: 0
#   # @title.zh-CN 后台类别 RAM
#   # @title.en-US Background RAM
#   # @description.zh-CN deferred worker 读入磁盘输入前、failure capture 编码前取得独立额度；其他后台费用仍待接入。
#   # @description.en-US Deferred workers acquire before reading stored input; failure capture acquires before encoding independent copies. Other background consumers remain unwired.
#   background_ram_bytes: 0
#   # @title.zh-CN 终结类别 RAM
#   # @title.en-US Completion RAM
#   # @description.zh-CN HTTP 新工作和 deferred worker 原子预留此 RAM 额度，分别保持到 handler 或后台终结写入退出；逻辑信用，不代表物理预留或单条终结字节核销。
#   # @description.en-US HTTP new work and deferred workers atomically reserve this RAM credit through handler return or background terminal write; logical credit, not a physical reservation or per-record settlement charge.
#   completion_ram_bytes: 0
#   # @title.zh-CN 恢复类别 RAM
#   # @title.en-US Recovery RAM
#   # @description.zh-CN 不得超过独立恢复储备；生产恢复消费仍待接入。
#   # @description.en-US Cannot exceed the independent recovery reserve; production recovery consumers remain unwired.
#   recovery_ram_bytes: 0
#   # @title.zh-CN claim 控制 RAM
#   # @title.en-US Claim control RAM
#   # @description.zh-CN 至少为 max_claims × 1024 字节，覆盖逻辑元数据。
#   # @description.en-US At least max_claims times 1024 bytes for logical claim metadata.
#   control_ram_bytes: 0
#   # @title.zh-CN 独立恢复 RAM 储备
#   # @title.en-US Independent recovery RAM reserve
#   # @description.zh-CN 普通请求与后台任务不能借用；不是持久结算空间保证。
#   # @description.en-US Normal requests and background tasks cannot borrow it; not a durable settlement-space guarantee.
#   recovery_reserve_ram_bytes: 0
#   # @title.zh-CN 最大 claim 槽数
#   # @title.en-US Maximum claim slots
#   # @description.zh-CN 普通与恢复槽数之和；必须大于 recovery_claims。
#   # @description.en-US Total normal and recovery slots; must exceed recovery_claims.
#   max_claims: 0
#   # @title.zh-CN 恢复专用槽数
#   # @title.en-US Recovery-only claim slots
#   # @description.zh-CN 普通工作无法消耗这些槽；没有恢复槽时储备必须为零。
#   # @description.en-US Normal work cannot consume these slots; zero recovery slots require zero reserve.
#   recovery_claims: 0
#   # @title.zh-CN 每 claim 最大 owner
#   # @title.en-US Maximum owners per claim
#   # @description.zh-CN 取值 1 到 16；启用预算下的 failure capture 至少为 3，覆盖 packet、Store 调用和 writer owner。
#   # @description.en-US Between 1 and 16; budgeted failure capture requires at least 3 for packet, Store call and writer ownership.
#   max_owners: 0
#   # @title.zh-CN 单 HTTP 工作 RAM 估算
#   # @title.en-US Per HTTP work RAM envelope
#   # @description.zh-CN 须覆盖最大正文、解码副本、上游结果、同步终结和编码峰值；忽略 Content-Length。
#   # @description.en-US Must cover maximum body, decode copies, upstream results, synchronous finalization and encoding peaks; independent of Content-Length.
#   request_ram_bytes: 0
#   # @title.zh-CN 单 deferred worker RAM 估算
#   # @title.en-US Per deferred worker RAM envelope
#   # @description.zh-CN 覆盖读入、解码、调用、结果及终结；不足时保持 queued，不丢弃工作。
#   # @description.en-US Covers input, decoding, execution, output and finalization; refusal preserves queued work.
#   deferred_ram_bytes: 0
#   # @title.zh-CN 单 failure capture RAM 估算
#   # @title.en-US Per failure capture RAM envelope
#   # @description.zh-CN 启用 capture 时必须配置；覆盖截断前完整 JSON 编码、截断副本、plaintext、密封 bytes 及排队对象，实际 writer 退出后才退账。至少覆盖 request_ram_bytes 与三侧 max_bytes 之和，仍须校准放大峰值。
#   # @description.en-US Required when capture is enabled; covers full JSON encoding before truncation, truncation copies, plaintext, sealed bytes and queued objects until the actual writer exits. Must cover request_ram_bytes and three side byte limits; peak amplification still requires calibration.
#   capture_ram_bytes: 0
#   # @title.zh-CN 单 HA 重建/候选帧 RAM 估算
#   # @title.en-US Per HA reconstruction/candidate RAM envelope
#   # @description.zh-CN HA 启用共享预算时必须显式校准；覆盖源解码、wire 副本及最多一个等待窗口空间的候选。Recovery 类、储备及 claim 槽须同时覆盖两个候选、另一次重建以及三个 session 队列/入站 envelope 和一份 Source 固定读者及一份 Governance 原生去重缓存预留；构造逐帧验证也收费，分页/前置 reconcile 另行迁移；队列独立费用另用 replication_queue_ram_bytes，不覆盖完整投影或磁盘/确认 owner。
#   # @description.en-US Explicit calibration required for HA with shared budgets; covers source decode, wire copies and one blocked candidate. Recovery class/reserve/claims must fit two candidates, one additional reconstruction three session queue/read owners and one fixed NativeSource reader and one Governance cache owner; constructor streaming validation is charged, pagination/preliminary reconcile remain separate; independent queues use replication_queue_ram_bytes, projections and disk/confirmation owners remain separate.
#   replication_candidate_ram_bytes: 0
#   # @title.zh-CN 单复制 session 队列 RAM 估算
#   # @title.en-US Per replication session queue RAM envelope
#   # @description.zh-CN HA 启用共享预算时必须显式校准；覆盖整个发送队列字节/条数容量及活动 writer 记录，在构造队列前申请，与 replication_read_ram_bytes 合并为一个会话 claim；socket Close 完成且 reader/handler、writer 均退出后退还。Recovery 须同时容纳三个候选/重建三个 session 队列/入站 envelope 和一份 Source 读者与一份 Governance 去重缓存预留（十二个 claim）。TLS 内部和握手另行迁移。
#   # @description.en-US Explicit calibration required for budgeted HA; reserves full outbound byte/count capacity plus the active writer record before queue construction, combined atomically with replication_read_ram_bytes. Released after socket Close and actual reader/handler and writer exit. Recovery must fit three reconstructions three session queue/read owners and one fixed NativeSource reader and one Governance cache owner (twelve claims). TLS internals and handshake remain separate.
#   replication_queue_ram_bytes: 0
#   # @title.zh-CN 单复制 session 入站临时 RAM 估算
#   # @title.en-US Per replication session inbound temporary RAM envelope
#   # @description.zh-CN HA 启用共享预算时必须显式校准；握手完成后、任何 stream 帧读取前，与队列费用合并取得一个 Recovery claim；覆盖一个借用 wire 帧及同步接收/应用/ACK 回调临时工作集，空闲读取也持续预留。下限为最大 wire 帧六倍，仅拒绝明显不足；长期域投影、TLS 内部/握手、历史 replay 与 IO 另行迁移。
#   # @description.en-US Explicit calibration required for budgeted HA. After handshake, one Recovery claim atomically reserves queue plus inbound RAM before any stream read, covering a borrowed wire record and synchronous receive/apply/ACK temporaries even during idle reads. Six maximum wire frames is only a lower bound; retained domain projections, TLS/handshake, historical replay and IO require separate ownership.
#   replication_read_ram_bytes: 0
#   # @title.zh-CN 单 NativeSource 固定读者总 RAM 估算
#   # @title.en-US Aggregate fixed NativeSource reader RAM envelope
#   # @description.zh-CN HA 启用共享预算时必须显式校准；一份 Recovery claim 预留默认及两个 peer 游标组、密钥副本、可保留的 Ledger 解压流与 descriptor 元数据，构造 owned 副本前取得，Source Close join 全部读取、关流并清引用后归还；空闲和重连保持同份预留。下限仅拒绝明显不足，不替代实测，不包含输出 payload、临时 decode、历史投影、IO 进展时限或磁盘费用。Recovery 总量须同时覆盖 3*(candidate+queue+read)+reader+governance_log+audit_log+pricing_lifetime+pricing_io+accounting_recovery 与十二个基础 claim 控制费用；每个启用的持久投影 Disk ceiling 再增加一个 Recovery claim。
#   # @description.en-US Explicit calibration required for budgeted HA. One Recovery claim reserves the default and two peer cursor sets, owned keys and retained Ledger decompression/descriptor state before owned allocation, until Source Close joins all reads, closes streams and clears references. Idle/reconnect reuse the same reservation. The lower bound needs measured calibration; output payloads, transient decode, historical projections, IO progress and disk costs remain separate. Recovery must fit 3*(candidate+queue+read)+reader+governance_log+audit_log+pricing_lifetime+pricing_io+accounting_recovery plus twelve claim control costs.
#   replication_reader_ram_bytes: 0
#   # @title.zh-CN 原生 Governance 去重缓存 RAM 估算
#   # @title.en-US Native Governance retry-cache RAM envelope
#   # @description.zh-CN 启用共享预算时必须显式校准，至少 2 MiB；覆盖固定 4096 个身份/内容指纹、日志位置、ring/map 与 owner 元数据，构造及文件 IO 前取得一份 Recovery lifetime claim。Close join 全部原生读写、成功关闭实际文件并清除缓存引用后归还。恢复扫描、批量编码、投影及磁盘另行计费；下限不是 allocator/RSS 上界。HA Recovery 须同时覆盖十二个基础 claim、每个启用的持久投影 Disk ceiling 的额外 claim 与所有 envelope。
#   # @description.en-US Explicit calibration required with shared budgets; at least 2 MiB for 4096 fixed identity/content fingerprints, native positions, ring/map and owner metadata. One Recovery lifetime claim is acquired before construction or file IO and released only after native operations join, physical Close succeeds and cache references clear. Replay, batch encoding, projections and disk need separate ownership; the lower bound is not an allocator/RSS limit. Budgeted HA must fit all envelopes, twelve base Recovery claims and one additional Recovery claim for each enabled persistent projection disk ceiling.
#   governance_log_ram_bytes: 0
#   # @title.zh-CN Audit 固定去重缓存 RAM
#   # @title.en-US Audit fixed retry cache RAM
#   # @description.zh-CN 启用共享预算时须校准，至少 2 MiB；固定 4096 身份/内容指纹、位置和 ring/map，原生 IO 前取得 Recovery lifetime claim。Close 撤销新操作，join 已进入的读取及写入，关闭实际文件并清除缓存引用后归还。恢复扫描与批量编码另计；下限不替代 RSS 实测。普通角色五份基础 Recovery claim，HA 十二份，磁盘 owner 另加。
#   # @description.en-US Calibrated envelope with a 2 MiB structural floor for 4096 fixed fingerprints, positions and map/ring storage. Acquired before native IO and retained through withdrawal, actual reader/writer join, physical Close and cache-reference removal. Codec/recovery workspaces are separate. Five base Recovery claims for normal roles, twelve for HA, plus disk owners; not an RSS bound.
#   audit_log_ram_bytes: 0
#   # @title.zh-CN 固定价格 owner RAM 估算
#   # @title.en-US Fixed pricing owner RAM envelope
#   # @description.zh-CN 启用共享预算时必须显式校准，至少 1 MiB；固定 4096 锁/marker 槽和进程 clock owner 在分配前取得 Recovery lifetime claim，Store 实际 join、关闭 clock 文件及清除槽后归还。HA 须覆盖十二个基础 Recovery claim，并为每个启用的持久投影 Disk ceiling 另留一份 Recovery claim。磁盘费用另行迁移。
#   # @description.en-US Explicit calibration required with shared budgets; at least 1 MiB for 4096 fixed lock/marker slots and the process clock owner. Acquired before allocation, released after Store joins operations, closes the clock file and clears slots. HA requires twelve base Recovery claims plus one Recovery claim for each enabled persistent projection disk ceiling; the disk charge remains separate.
#   pricing_lifetime_ram_bytes: 0
#   # @title.zh-CN 单价格 IO RAM 估算
#   # @title.en-US Per pricing IO RAM envelope
#   # @description.zh-CN 至少 32 MiB 并实测宽行/JSON 放大峰值；在选择、Prepare 或冷审计读取/分配前取得 IO claim，真实调用和临时审计文件 Close 完成后归还。须与一个 HTTP request 同时容纳，IO 类别也须配置。启动审计 outbox 完整预校验/分页交付另用同额 Recovery claim，直至实际回调退出才归还；普通角色须预留五份 Recovery claim，HA 十二份。它不是 RSS/磁盘上界。
#   # @description.en-US At least 32 MiB with measured wide-row/JSON amplification; IO claim precedes selection, Prepare or cold-audit reads/allocations and retires after actual return and temporary audit-file Close. Must fit alongside one HTTP request and within the IO class. Startup audit-outbox prevalidation and paged delivery hold a separate Recovery claim of the same size through actual callback exit; normal roles need five Recovery claims, HA twelve. Not an RSS or disk bound.
#   pricing_io_ram_bytes: 0
#   # @title.zh-CN 持久目录启动清点磁盘上限
#   # @title.en-US Persistent startup inventory disk ceiling
#   # @description.zh-CN 大于零时，在打开业务写入者之前对现有 DataDir 树执行有界清点并单独计费；此基线与各消费者后续增长和替换上限相加。零保持原启动路径。逻辑费用不预留物理块，须按实际目录和文件系统余量校准。
#   # @description.en-US When positive, reconcile and charge the existing DataDir tree before business writers open. This baseline is additional to consumer growth and replacement ceilings. Zero preserves legacy startup. Logical accounting does not reserve filesystem blocks; calibrate against the actual tree and filesystem headroom.
#   persistent_inventory_disk_bytes: 0
#   # @title.zh-CN Ledger 原生追加与辅助文件磁盘额度
#   # @title.en-US Ledger native append and auxiliary disk capacity
#   # @description.zh-CN 一个 Runtime 生命周期的额外 Ledger 追加和辅助产物容量；现有树由 persistent_inventory_disk_bytes 单独计费，已发布或状态不确定的产物继续保留费用。启用时还须配置正数 inventory 上限。零表示未启用，不是物理块预留。
#   # @description.en-US Additional Ledger append and auxiliary-product capacity for one Runtime lifetime. Charge existing files independently through persistent_inventory_disk_bytes; published or uncertain products keep their fees. Requires a positive inventory ceiling when enabled. Zero disables it; this does not reserve physical blocks.
#   ledger_append_disk_bytes: 0
#   # @title.zh-CN 投影启动构建与账务恢复 RAM 估算
#   # @title.en-US Projection startup construction and accounting recovery RAM envelope
#   # @description.zh-CN 启用共享预算时必须显式校准，至少 128 MiB；默认各角色在构建派生文件前取得一份 Recovery claim，覆盖 Ledger 全源认证与有限批归约，Replica 还覆盖共同 Usage 构建；Standalone/Primary 的 Usage 完整回放、Governance 外部锚校验与构建、Usage 启动归档窗口核对及后续两级恢复均串行复用同额 workspace，估算取各阶段峰值最大值。费用覆盖有限页、关联校验、结算编码与 native 写入/确认等待，构建/验证/失败清理或整个恢复调用和 writer Close 完成后归还。取消不提前退账；资源不足保持不就绪。普通角色须容纳五份基础 Recovery claim，HA 十二份；每个启用的持久投影 Disk ceiling 另需一个 Recovery claim。原生 Open、长期 DB/cache、mmap、磁盘及未确认 owner 另行迁移；下限不替代生产峰值接受。
#   # @description.en-US Explicit calibration required with shared budgets, at least 128 MiB. Default roles reserve one Recovery claim before derived-file construction for full Ledger authentication and bounded reduction; Replica also holds it through joint Usage construction. Standalone/Primary Usage replay, Governance anchor verification/build, Usage archive/window startup verification and two-level accounting recovery reuse this workspace sequentially; calibrate to the largest phase peak. It covers pages, attribution checks, settlement encoding, native IO, confirmation, failed-candidate cleanup and actual writer Close. Cancellation does not release early; refusal preserves nonreadiness. Four base Recovery claims for normal roles, twelve for HA, plus one Recovery claim for each enabled persistent projection disk ceiling; native Open, live DB/cache, mmap, disk and unconfirmed owners remain separate. The floor does not replace production peak acceptance.
#   accounting_recovery_ram_bytes: 0
#   # @title.zh-CN Ledger 派生投影数据文件上限
#   # @title.en-US Ledger derived projection data-file ceiling
#   # @description.zh-CN 大于零时，启动重建前收费 Recovery Disk，并通过 bbolt MaxSize 限制数据文件增长；通过 role cut 校验后同一费用转为 Background owner，直到实际删除派生文件才退费。必须同时为 Recovery 启动和 Background 持久 owner 校准类别/总额。仅限制文件长度，不预留物理块或覆盖 mmap/page cache；零表示未启用。
#   # @description.en-US When positive, charge Recovery Disk before startup rebuild and use bbolt MaxSize to limit data-file growth. After role-cut validation, reclassify the same charge as a persistent Background owner until the derived file is actually removed. Calibrate both startup Recovery and persistent Background/class/total envelopes. Limits file length only; it does not reserve physical blocks or cover mmap/page cache. Zero disables it.
#   ledger_projection_disk_bytes: 0
#   # @title.zh-CN Ledger segment locator 磁盘上限
#   # @title.en-US Ledger segment locator disk ceiling
#   # @description.zh-CN 大于零时限制一个 Runtime 为认证 segments.idx sidecar 及有界重建 workspace 预留的总 Disk 字节。Standalone 用于一个 Log；HA 为当前/旧 inode、最多三个 NativeSource reader locator 和发布 workspace 分配六份上限。sidecar 由 Ledger key 派生 MAC 并绑定完整 segments.json，仍可从权威 manifest 重建。Runtime 关闭后若 sidecar 留盘则继续计费；没有持久 sidecar 时，在 Log/reader 退出后释放。逻辑上限不预留物理块；零表示不设上限。
#   # @description.en-US When positive, cap the total Disk bytes reserved by one Runtime for the authenticated segments.idx sidecar and its bounded rebuild workspace. Standalone assigns the cap to the Log; HA divides it into six shares for current/old inodes, up to three NativeSource reader locators, and publication workspace. The sidecar uses a Ledger-key-derived MAC bound to the complete segments.json bytes and can be rebuilt from the authoritative manifest. Keep its claim after Runtime.Close when the sidecar remains on disk; release after all readers close when no persistent sidecar exists. Logical ceiling only; no physical block reservation. Zero disables it.
#   ledger_segment_index_disk_bytes: 0
#   # @title.zh-CN Usage 派生投影数据文件上限
#   # @title.en-US Usage derived projection data-file ceiling
#   # @description.zh-CN 大于零时，Standalone/Primary/Replica Usage fresh 投影的启动前后按 Recovery/Background 生命周期计费，并通过 bbolt MaxSize 限制数据文件增长。Ledger 与 Usage 上限总和必须能同时装入 Recovery、Background、Recovery reserve 和总额。文件删除失败不会退费；该值不预留物理块或覆盖 mmap/page cache；零表示未启用。
#   # @description.en-US When positive, charge the fresh Standalone/Primary/Replica Usage projection through its Recovery/Background lifecycle and use bbolt MaxSize to limit data-file growth. The sum of Ledger and Usage ceilings must fit Recovery, Background, Recovery reserve and total envelopes at the same time. Failed file removal does not refund the charge. This does not reserve physical blocks or cover mmap/page cache; zero disables it.
#   usage_projection_disk_bytes: 0
#   # @title.zh-CN Usage 归档树逻辑磁盘上限
#   # @title.en-US Usage archive tree logical disk ceiling
#   # @description.zh-CN 大于零时，对完整 UsagePath 树执行有界清点，并在写入前拒绝会越过上限的导出、目录发布、校验或回收。Runtime 在清点前申请 Recovery Disk ceiling，校验归档并确定角色后转为持久 Background owner；归档随 Runtime.Close 保留，因此费用也保留。维护/诊断打开路径执行文件 ceiling。Runtime scratch 还需要正数的 io_disk_bytes envelope；单次操作超出该类别当前余量时会被拒绝。只限制逻辑文件字节，不预留物理块，也不替代物理 ENOSPC 处理；零表示未启用。
#   # @description.en-US When positive, inventory the complete UsagePath tree with bounded memory and reject exports, catalog publication, verification or reclamation before writes cross the ceiling. Runtime charges the Recovery Disk ceiling before inventory and reclassifies it as a persistent Background owner after archive validation and role selection; the archive survives Runtime.Close, so the charge does too. Maintenance/diagnostic opens enforce the file ceiling. Runtime scratch also requires a positive io_disk_bytes envelope; an operation is refused when its reservation exceeds current class capacity. This caps logical file bytes only; it does not reserve physical blocks or handle physical ENOSPC; zero disables it.
#   usage_archive_disk_bytes: 0
#   # @title.zh-CN Usage 归档读取 RAM 预算
#   # @title.en-US Usage archive reader RAM envelope
#   # @description.zh-CN 每个并发读者的校准 RAM 额度；4 个固定槽必须能同时装入 IO 和启动 Recovery。启动及一次性命令从 Recovery 计费，Runtime 从 IO 计费，直到读者关闭并退出。零表示禁用共享读者 RAM 记账，不是零内存上界。
#   # @description.en-US Calibrated RAM per concurrent reader; all four fixed slots must fit IO and startup Recovery together. Startup and one-shot commands charge Recovery, while Runtime charges IO through reader close and exit. Zero disables shared reader RAM accounting; it is not a zero-memory bound.
#   usage_archive_read_ram_bytes: 0
#   # @title.zh-CN 备份目录索引工作区磁盘上限
#   # @title.en-US Backup source-catalog workspace disk ceiling
#   # @description.zh-CN 大于零时，在构建备份 SourceCatalog 前从共享 Recovery 申请同额费用，并用 bbolt MaxSize 限制其临时索引文件。目录关闭并完成所有权安全清理后释放；零表示不限制此索引。它不限制快照副本、加密归档输出或物理磁盘，也不预留物理块。
#   # @description.en-US When positive, acquire the same shared Recovery Disk charge before building the backup SourceCatalog and cap its temporary bbolt index with MaxSize. Release after close and ownership-safe cleanup; zero leaves this index uncapped. This does not cap staged snapshots, encrypted archive output or physical disk, and reserves no blocks.
#   backup_workspace_disk_bytes: 0
#   # @title.zh-CN Provider 对象引用校验磁盘上限
#   # @title.en-US Provider object reference disk ceiling
#   # @description.zh-CN 在线维护私有引用集合的完整文件上限；零使用有限 32 MiB，正值须能放入共享 IO Disk；不是生产容量承诺。
#   # @description.en-US Full private reference-set ceiling for online maintenance; zero selects a finite 32 MiB, positive values must fit shared IO Disk. Not a production capacity promise.
#   provider_object_reference_disk_bytes: 0
#   # @title.zh-CN 恢复 staging 磁盘上限
#   # @title.en-US Restore staging disk ceiling
#   # @description.zh-CN 大于零时，完整认证归档后先计算 payload 总字节，超过此值即拒绝抽取；未超限时对已验证 payload 大小申请 Recovery Disk claim，直到 staging 安全清理后释放。只限制逻辑文件字节，不覆盖文件系统块元数据或物理预留；零表示不限制。
#   # @description.en-US When positive, authenticate the complete archive and sum payload bytes before extraction; reject if the total exceeds this value. Otherwise charge the verified payload size to Recovery until staging is safely removed. Logical file bytes only; not filesystem metadata or physical reservation. Zero disables it.
#   restore_workspace_disk_bytes: 0
#   # @title.zh-CN Governance 派生投影数据文件上限
#   # @title.en-US Governance derived projection data-file ceiling
#   # @description.zh-CN 大于零时，Standalone/Primary 启动重建前收费 Recovery Disk，并通过 bbolt MaxSize 限制 Outcome 投影文件增长；认证 journal 与角色切面校验后转为 Background owner，直到实际删除文件才退费。须与 Ledger/Usage 上限共同满足总额、Background、Recovery、Recovery reserve 和 claim 槽。仅限制文件长度，不预留物理块或覆盖 mmap/page cache；零表示未启用。
#   # @description.en-US When positive, charge Recovery Disk before Standalone/Primary startup rebuild and use bbolt MaxSize to limit Outcome projection growth. Reclassify as a persistent Background owner only after authenticated journal and role-cut checks; retain the charge until the file is actually removed. Must fit shared Total, Background, Recovery, Recovery reserve and claim slots together with Ledger/Usage ceilings. Limits file length only; it does not reserve physical blocks or cover mmap/page cache; zero disables it.
#   governance_projection_disk_bytes: 0
#   # @title.zh-CN Governance 原生认证日志文件上限
#   # @title.en-US Governance native authenticated journal file ceiling
#   # @description.zh-CN 大于零时，Standalone/Primary/Replica 启动前为完整认证 Governance 日志申请 Recovery Disk ceiling；已有文件超过上限时启动失败，本地批量追加和 Replica 复制批次在写入前整体拒绝。认证日志 Open 后(Replica 还须应用 confirmed prefix)，同一费用转为 Background，并在 Runtime 生命周期内保留，因为原生日志不会随 Runtime.Close 删除。须和其它持久 ceiling 同时装入 Total/Background/Recovery/reserve 与专用 claim。只限制逻辑文件字节，不预留物理块或覆盖文件系统元数据；零表示未启用。
#   # @description.en-US When positive, Standalone/Primary/Replica startup acquires a Recovery Disk ceiling for the complete authenticated Governance journal. Startup fails if the existing file exceeds it; local append batches and replicated batches are refused atomically before writes when they exceed it. After authenticated Open (and, for Replica, confirmed-prefix application), the same charge moves to Background and remains for the Runtime lifetime because Runtime.Close does not delete the native journal. Fit it with other persistent ceilings in Total/Background/Recovery/reserve envelopes and a dedicated claim. This is logical file-byte accounting, not physical block reservation or filesystem metadata coverage; zero disables it.
#   governance_log_disk_bytes: 0
#   # @title.zh-CN Audit 原生认证日志文件上限
#   # @title.en-US Audit native authenticated journal file ceiling
#   # @description.zh-CN 大于零时，Standalone/Primary/Replica 启动前为完整认证 Audit 日志申请 Recovery Disk ceiling；已有文件超过上限时启动失败，本地追加批次和 Replica 复制批次在写入前整体拒绝。认证日志 Open 后(Replica 在 confirmed prefix 应用后)转为 Background；Runtime.Close 不删除日志，因此 claim 保留到 Runtime 生命周期结束。CLI/维护入口也执行相同文件 ceiling，但不持有 Runtime Manager claim。须与其它持久 ceiling 共同满足总额、Background、Recovery、reserve 及专用 claim。只限制逻辑文件字节，不预留物理块或覆盖文件系统元数据；零表示未启用。
#   # @description.en-US When positive, Standalone/Primary/Replica startup reserves a Recovery Disk ceiling for the complete authenticated Audit journal and fails if the existing file exceeds it. Local append batches and replicated batches are refused atomically before writes when over the ceiling. After authenticated Open (and, for Replica, confirmed-prefix application), the claim moves to Background; Runtime.Close does not delete the journal, so the claim remains for the Runtime lifetime. CLI/maintenance opens enforce the same file ceiling but do not hold the live Runtime Manager claim. It must fit the shared Total, Background, Recovery and reserve envelopes with a dedicated claim alongside other persistent ceilings. Logical file-byte accounting only; it does not reserve physical blocks or filesystem metadata. Zero disables it.
#   audit_log_disk_bytes: 0
#   # @title.zh-CN Metadata 原生认证日志文件上限
#   # @title.en-US Metadata native authenticated journal file ceiling
#   # @description.zh-CN 大于零时，Standalone/Primary/Replica 启动前为 Metadata 原生日志申请 Recovery Disk ceiling；已有文件超限则启动失败，本地追加和 Replica 复制批次写入前整体拒绝。Runtime Close 不删除日志，认证后转为 Background 并保留 claim。Metadata 日志会在安全应用前缀后按阈值裁剪；若 HA 慢成员阻止裁剪，达到 ceiling 后写入会失败关闭。只限制逻辑文件字节，不预留物理块；零表示未启用。
#   # @description.en-US When positive, Standalone/Primary/Replica startup reserves a Recovery Disk ceiling for the native Metadata journal. Startup rejects an existing oversized file; local append and Replica batches are rejected atomically before writing. Runtime.Close does not delete the journal, so its authenticated claim moves to Background and remains for the Runtime lifetime. Metadata trims only a safe applied prefix; if a slow HA member prevents trimming, writes fail closed at the ceiling. Logical file-byte accounting only; no physical block reservation. Zero disables it.
#   metadata_store_disk_bytes: 0 # bbolt data file; positive ceiling also charges ceiling+32MiB logical mapping RAM; no physical block/RSS guarantee
#   # @title.zh-CN 七根引擎的遗留 Metadata 文件上限
#   # @title.en-US Legacy Metadata file ceiling for the seven-root engine
#   # @description.zh-CN 仅 memory_state_required 可用。正值独立限制真实 bbolt 解锁文件、维护映射和导出暂存文件，并按该值加 32MiB 收取映射 RAM；必须不超过 metadata_store_disk_bytes。selected COW 仍保留完整 Metadata Disk ceiling。已有或生成文件超限时拒绝；零保留原全额映射估算。
#   # @description.en-US Requires memory_state_required. A positive value separately caps actual legacy bbolt unlock files, maintenance mappings and staged exports and charges that ceiling plus 32MiB of mapping RAM. It must not exceed metadata_store_disk_bytes; selected COW retains its full Metadata disk ceiling. Oversized existing or generated files are refused. Zero preserves the original full mapping estimate.
#   legacy_metadata_file_disk_bytes: 0
#   metadata_journal_disk_bytes: 0
#   # @title.zh-CN HA Ordering 原生认证日志文件上限
#   # @title.en-US HA Ordering native authenticated journal file ceiling
#   # @description.zh-CN 大于零时，每个 HA Runtime 在认证 Ordering 日志前申请 Recovery Disk ceiling；已有日志超限则拒绝启动，本地和 Replica 新排序记录超限时写入前拒绝。日志不可裁剪且保留整个复制顺序，因此达到上限会阻止后续 HA 写入。运维可在确认共享预算和运行条件后调高上限并重启，也可执行安全的新 incarnation 迁移。Runtime 关闭不删除文件，claim 在 Runtime 生命周期内保留。只限制逻辑文件字节，不预留物理块；零表示未启用。
#   # @description.en-US When positive, each HA Runtime reserves a Recovery Disk ceiling before authenticating the Ordering journal; startup rejects an oversized file and local or Replica ordering records are refused before writing when over the cap. The journal is not trim-able and preserves the full replication order, so reaching the cap blocks further HA writes. Operations may raise the ceiling and restart after checking shared budgets and runtime conditions, or perform a safe new-incarnation migration. Runtime.Close leaves the file in place and retains its claim for the Runtime lifetime. Logical file-byte accounting only; no physical block reservation. Zero disables it.
#   ordering_journal_disk_bytes: 0
